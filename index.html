"2.8":"<h2>CNG Vehicle Fires</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly control vehicle fires fueled by compressed natural gas (CNG), minimizing life and property damage.</p><h3><strong>II. DISCUSSION</strong></h3><p>CNG vehicle fires may initially appear small and isolated, but they present unique challenges. CNG tanks do not <strong>BLEVE</strong> like propane tanks; however, with heat or flame exposure, CNG tanks can rupture, causing an uncontrolled high-pressure release of flammable gas. Pressure relief devices (PRDs) are temperature-activated and release gas through vent tubes when the eutectic material melts at <strong>219°F</strong>. PRDs remain open once activated. Special care is required to identify and mitigate these risks during CNG vehicle fire incidents.</p><h3><strong>III. GUIDELINE</strong></h3><ol><li>The appropriate apparatus shall respond quickly with due regard for safety (SOG 1.4).</li><li>Implement <strong>Incident Command</strong>.</li><li>All personnel must don proper <strong>Personal Protective Equipment (PPE):</strong><ul><li>Full turnout gear and SCBA when operating near fire or smoke.</li><li>The Incident Commander shall wear appropriate bunker gear or helmet and duty uniform based on the situation.</li></ul></li><li><strong>Apparatus Positioning:</strong> Position apparatus to ensure maximum firefighter safety:<ul><li>Block at least one traffic lane to create a safety zone.</li><li>Position the engine so the pump operator has a clear view of the fire.</li></ul></li><li>For heavy fire involvement, deploy a <strong>minimum 1-1/2” handline</strong>. Booster lines may be used for smaller fires if conditions allow.</li><li>Address traffic control needs. Responder safety takes precedence over maintaining traffic flow.</li><li><strong>Defensive Positioning:</strong> If flame or heat infringes on the CNG tank, secure a <strong>500-yard perimeter</strong> and switch to defensive operations.</li><li>After <strong>PRD activation</strong> is complete and no uncontrolled release occurs, resume offensive firefighting operations.</li></ol><h3><strong>IV. STRATEGIC CONSIDERATIONS</strong></h3><ol><li>Ensure there are no victims threatened by the fire.</li><li>Communicate with the driver as part of the initial size-up to determine:<ul><li>CNG tank location, tank levels, and system status.</li></ul></li><li>Use a <strong>Thermal Imaging Camera (TIC)</strong> to locate fire and determine tank temperatures.</li><li>Confine the fire to the vehicle and protect nearby exposures:<ul><li><strong>Do not attempt to cool the CNG tanks.</strong></li><li>If PRDs activate, monitor and secure the area: Expect high-pressure flammable gas release from vent lines.</li></ul></li><li><strong>Defensive Operations:</strong><ul><li>If flame/heat impacts the CNG tank, establish a <strong>500-yard exclusion zone</strong>.</li><li>Allow PRD activation to complete before resuming operations.</li></ul></li><li>Avoid gaining access to hidden areas if the CNG tank is exposed to flame or heat.</li></ol><h3><strong>V. TACTICAL CONSIDERATIONS</strong></h3><ol><li>For small fires, a booster line may be sufficient for extinguishment.</li><li>The <strong>pump operator</strong> shall pump attack lines according to the apparatus pump chart.</li><li><strong>Hazards to Be Aware Of:</strong><ul><li><strong>Popping Tires:</strong> Tire pressure failure may cause explosive sounds.</li><li><strong>PRD Activation:</strong> High-pressure flammable gas jets will escape through vent lines.</li><li><strong>Airbag Deployment:</strong> Airbags may deploy unpredictably.</li><li><strong>Gas Struts:</strong> Found in bumpers, hatches, and hoods; they may forcibly explode and send shrapnel.</li><li><strong>Fuel Tank Failure (Hybrid Vehicles):</strong> Potential for flammable liquid fire.</li></ul></li><li><strong>PRD Vents:</strong> Be aware that:<ul><li>CNG vent lines may be damaged during fire or collision.</li><li>A compromised vent line can direct flammable gas in unpredictable directions.</li></ul></li><li>For <strong>garbage truck fires</strong>, offload the garbage (if feasible) to improve access to fire areas.</li><li>For flammable liquid involvement, apply Class B foam using an <strong>inline foam eductor</strong>.</li><li><strong>Approach from Sides or Corners:</strong> This minimizes risk if bumper gas struts fail.</li><li>Work from the <strong>upwind and uphill</strong> side of the vehicle when possible.</li><li><strong>Overhaul and Salvage:</strong> Once exposed fire is controlled:<ul><li>Open the hood, doors, and trunk for complete extinguishment.</li><li>Remove glass as necessary.</li></ul></li><li><strong>Roadway Debris:</strong> Remove loose debris using hose streams or brooms.</li></ol>",
"2.9":"<h2>Wildland Fires</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly control wildland fires, minimizing life and property damage.</p><h3><strong>II. DISCUSSION</strong></h3><p>Wildland fires are dynamic, rapidly changing incidents that can challenge even the most experienced fire officers. A thorough fire size-up, effective communications, and strict adherence to firefighter safety practices are critical to ensuring success and reducing injuries. Firefighters must continually evaluate fire conditions and adjust tactics as needed to maintain safety.</p><p>Wildland firefighting operations require attention to <strong>LCES</strong> (Lookouts, Communications, Escape Routes, and Safety Zones). If communications cannot be established or firefighter safety is compromised, firefighters must back off and re-evaluate tactics.</p><h3><strong>III. FIREFIGHTER SAFETY</strong></h3><h4><strong>PPE</strong></h4><p>In wildland fire settings, proper PPE is essential for firefighter safety. Structural turnout gear is not suitable for wildland operations due to increased fatigue and heat stress. <strong>Wildland PPE includes:</strong></p><ul><li>Helmet</li><li>Fire-resistant brush shirt/jacket and pants</li><li>Leather, ankle-high boots (no nylon boots)</li><li>Eye and hearing protection</li><li>Work gloves</li><li>Canteens or water bottles for hydration</li></ul><h4><strong>Hydration</strong></h4><p>Heat and dehydration are major risks in wildland firefighting. Personnel must carry drinking water, remain hydrated, and monitor for signs of heat-related illnesses.</p><h4><strong>Crew Safety</strong></h4><p>Wildland fires require heightened crew accountability:</p><ul><li>Assure apparatus 4WD is engaged and operational.</li><li>Assure firecom is in use.</li><li>Maintain visual and verbal contact with all crew members.</li><li>Use the buddy system to enhance safety.</li><li>Company Officers must ensure clear communication and situational awareness.</li></ul><h4><strong>Ten Standard Fire Orders</strong></h4><p>Wildland firefighting requires adherence to these basic safety principles:</p><ol><li>Keep informed on fire weather conditions and forecasts.</li><li>Know what the fire is doing at all times.</li><li>Base all actions on expected fire behavior.</li><li>Identify escape routes and safety zones.</li><li>Post lookouts when danger exists.</li><li>Be alert, calm, and decisive.</li><li>Maintain prompt communications with supervisors and crews.</li><li>Give clear instructions and ensure understanding.</li><li>Maintain control of forces at all times.</li><li>Fight fire aggressively but prioritize safety.</li></ol><h3><strong>IV. FIRE BEHAVIOR</strong></h3><p>Understanding fire behavior is critical. Key factors include:</p><ul><li><strong>WEATHER:</strong> Wind speed, direction, temperature, and humidity dramatically impact fire spread. <strong>Red Flag Warnings</strong> signal dangerous fire conditions.</li><li><strong>FUEL:</strong> Light fuels (grass) burn quickly; heavy fuels (brush, trees) produce higher intensity fires. Fuels near river bottoms or dense vegetation increase complexity.</li><li><strong>TOPOGRAPHY:</strong> Fire moves uphill rapidly and can crown over hillsides. Access and egress challenges require careful planning.</li></ul><h3><strong>V. STRATEGIC CONSIDERATIONS</strong></h3><h4><strong>COMMAND</strong></h4><p>The Incident Commander must:</p><ul><li>Prioritize life safety (firefighters and civilians).</li><li>Establish <strong>LCES</strong> for all operations.</li><li>Develop an action plan based on size-up (values at risk, weather, fuel, and terrain).</li><li>Assign sectors/groups to manage operations efficiently.</li><li>Protect firefighter health with rehab and medical monitoring.</li></ul><h3><strong>VI. TACTICAL CONSIDERATIONS</strong></h3><h4><strong>Size-Up</strong></h4><p>A thorough initial size-up includes:</p><ul><li>Fire location, spread rate, and hazards.</li><li>Fuel type, fuel loading, and weather.</li><li>Topography (slopes, access, safety zones).</li><li>Threats to structures, power lines, or resources.</li></ul><h4><strong>Direct Attack (Offensive)</strong></h4><ul><li>Work directly on the fire's edge whenever safe.</li><li>Use an <strong>anchor and flank</strong> method to prevent being outflanked.</li><li>Maintain a position in the burned (black) area for safety.</li><li>Use pump-and-roll operations for quick suppression in light fuels.</li></ul><h4><strong>Indirect Attack (Defensive)</strong></h4><ul><li>Used when direct attack is unsafe or inaccessible.</li><li>Control lines are placed far from the fire's edge using firebreaks.</li></ul><h4><strong>Structure Protection/Interface Operations</strong></h4><ul><li>Thoroughly size up structures and access.</li><li>Keep hose lines short and apparatus mobile.</li><li>Apply water or foam to exposed structures.</li><li>Identify hazards: narrow roads, power lines, and nearby fuels.</li></ul><h3><strong>VII. MOP-UP OPERATIONS</strong></h3><p>Once the fire is under control, mop-up ensures no reignition occurs. Steps include:</p><ol><li>Extinguish all embers and hot spots.</li><li>Treat critical areas first and extend mop-up beyond the control line.</li><li>Remove smoldering materials and check for rolling debris.</li><li>Use water and Class A foam to improve effectiveness.</li><li>Monitor perimeter for spot fires and check regularly for rekindle.</li></ol>",
"2.10":"<h2>Oil Field Fires</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly control fires on oil field drilling, production, storage, transportation, and refining locations.</p><h3><strong>II. DISCUSSION</strong></h3><p>Fires on oil and gas sites pose unique risks, including pressure vessels, hazardous chemicals, poisonous gases, and large quantities of flammable liquids and gases. These sites require specialized knowledge of the facility operations to isolate and extinguish fires safely. Preplanning, accurate contact information, and participation in facility safety drills are critical for ensuring firefighter and public safety during these incidents.</p><p>Collaboration with <strong>facility representatives</strong> is essential. Firefighters <strong>do not operate valves or other equipment</strong> unless specifically instructed by the facility representative and approved by the Incident Commander.</p><h3><strong>III. GUIDELINE</strong></h3><p>The following steps outline the priority actions for oil field fire incidents:</p><h4><strong>Response and Arrival:</strong></h4><ul><li>Respond quickly with due regard for safety (<strong>SOP 1.4</strong>).</li><li>Establish <strong>Incident Command</strong> following SOP 1.5.</li><li>Stage apparatus at the facility entrance unless an immediate rescue is required.</li></ul><h4><strong>Facility Representative Coordination:</strong></h4><ul><li>Contact the <strong>facility representative</strong> as soon as possible using the emergency contact information posted at the facility entrance or listed in preplans.</li><li>Wait for the facility representative to arrive and provide direction. Do not enter the site until directed by the representative.</li><li>Integrate the representative into the Incident Command structure to assist in hazard identification and mitigation.</li></ul><h4><strong>Hazard Assessment and Incident Strategy:</strong></h4><ul><li>Assess hazards such as pressurized vessels, flammable materials, and gas leaks.</li><li>Prioritize life safety, site isolation, and fire containment.</li><li>Follow defensive operations until hazards are controlled.</li></ul><h4><strong>Operations:</strong></h4><ul><li>Do not attempt to extinguish natural gas fires unless the flow is controlled.</li><li>Protect exposures, including storage tanks, pipelines, and buildings.</li><li>Establish isolation zones and evacuation perimeters based on the size and severity of the incident.</li><li>Activate specialty resources as needed (hazmat, foam, air quality monitoring, etc.).</li></ul><h3><strong>IV. TACTICAL CONSIDERATIONS</strong></h3><h4><strong>Initial Assessment and Approach:</strong></h4><ol><li>Approach the scene cautiously from an <strong>upwind and uphill</strong> location.</li><li>Identify and isolate hazards (e.g., chemical tanks, gas lines, flare stacks).</li><li>Secure the area and establish isolation zones:<ul><li><strong>Hot Zone:</strong> Immediate danger area surrounding the fire.</li><li><strong>Warm Zone:</strong> Area for operational crews and decontamination.</li><li><strong>Cold Zone:</strong> Safe staging area for non-operational personnel.</li></ul></li><li>Contact the facility operator using posted emergency numbers or preplan contacts.</li><li>Deploy a <strong>minimum of 1-1/2” handlines</strong> to protect exposures and control small fires.</li></ol><h4><strong>Protecting Life, Property, and Environment:</strong></h4><ol><li>Rescue and evacuate any threatened civilians or facility workers.</li><li>Protect adjacent exposures such as:<ul><li>Storage tanks and pressure vessels.</li><li>Chemical storage areas.</li><li>Pipelines, flare stacks, and processing units.</li></ul></li><li><strong>Natural Gas Fires:</strong> Allow natural gas fires to burn until the gas supply is controlled. Extinguishing these fires prematurely can cause uncontrolled gas leaks.</li><li>Deploy firefighting foam or water streams to cool adjacent exposures:<ul><li>Apply Class B foam through inline foam eductors.</li><li>Use large-diameter handlines and monitor devices for effective coverage.</li></ul></li><li>Maintain safe standoff distances when managing pressure vessel fires or flare stack exposures.</li></ol><h4><strong>Defensive Operations:</strong></h4><ol><li>Maintain a <strong>defensive strategy</strong> if the fire cannot be controlled safely or the hazard level is high.</li><li>Isolate and secure the area, evacuating personnel within the perimeter.</li><li>Monitor air quality and wind direction for toxic gases (e.g., H2S, CO).</li><li>Provide information to the public and media regarding safety precautions.</li></ol><h4><strong>Communication and Coordination:</strong></h4><ol><li>Maintain clear communication with facility representatives, crews, and mutual aid partners.</li><li>Utilize the <strong>Incident Command System (ICS)</strong> for resource and sector management.</li><li>Assign a <strong>Safety Officer</strong> to monitor hazards and firefighter safety.</li></ol><h4><strong>Demobilization:</strong></h4><ol><li>Reopen evacuated areas only when the facility is stable and hazards have been mitigated.</li><li>Ensure all operations are complete and assist with post-incident investigations.</li><li>Conduct a final safety check with the facility representative prior to demobilizing resources.</li></ol>",
"2.11":"<h2>Hydrant Operations</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly establish a water supply from the municipal hydrant system.</p><h3><strong>II. DISCUSSION</strong></h3><p>There are multiple methods and options for supplying engines from hydrants. Engine operators must understand the supply connections, their limitations, and what pump panel gauges indicate about water supply. Effective hydrant operations require knowledge of apparatus flow capacities, hose friction loss, and hydrant flow rates.</p><h3><strong>III. GUIDELINE</strong></h3><p>To ensure effective water supply operations, firefighters must understand hydrant capabilities, supply hose limitations, apparatus capacities, and nozzle flow rates.</p><h4><strong>Apparatus Capacity:</strong></h4><ul><li><strong>Engine 1:</strong> 1500 GPM</li><li><strong>Engine 2:</strong> 1250 GPM</li><li><strong>Engine 3:</strong> 1500 GPM</li><li><strong>Engine 4:</strong> 1500 GPM</li></ul><h4><strong>Nozzle Flow Rates:</strong> <em>(Common equipment, not exhaustive)</em></h4><ul><li><strong>1.5” Combi Nozzle:</strong> 160 GPM @ 50 PSI</li><li><strong>1.5” 7/8 Smooth Bore:</strong> 160 GPM @ 50 PSI</li><li><strong>2.5” Combi Nozzle:</strong> 265 GPM @ 50 PSI</li><li><strong>2.5” 1 1/8 Smooth Bore:</strong> 265 GPM @ 50 PSI</li></ul><h4><strong>Supply Hose Friction Loss (Reference):</strong></h4><table><thead><tr><th>Flow Rate (GPM)</th><th>3” Hose</th><th>4” Hose</th></tr></thead><tbody><tr><td>320 GPM</td><td>7 PSI</td><td>2 PSI</td></tr><tr><td>425 GPM</td><td>12 PSI</td><td>4 PSI</td></tr><tr><td>1000 GPM</td><td>68 PSI</td><td>20 PSI</td></tr></tbody></table><p><em>Note: A typical city block is approximately 350’ from center street.</em></p><h4><strong>Hydrant Flow Rates and Color Coding:</strong></h4><ul><li><strong>Blue:</strong> Class AA – Flow rate of 1,500 GPM or greater</li><li><strong>Green:</strong> Class A – Flow rate of 1,000–1,499 GPM</li><li><strong>Orange:</strong> Class B – Flow rate of 500–999 GPM</li><li><strong>Red:</strong> Class C – Flow rate of less than 500 GPM</li></ul><h4><strong>Minimum Residual Pressure:</strong></h4><ul><li><strong>20 PSI:</strong> Lower limit for safe operation. Notify IC if pressure falls below this level.</li><li><strong>10 PSI:</strong> Absolute lower limit. No additional lines should be pulled unless approved by the OIC. Monitor closely to prevent hydrant overload.</li></ul><h4><strong>Hydrant Opening Speed:</strong></h4><ul><li>Hydrant valves should <strong>always be opened and closed slowly</strong> to prevent water hammer, which can damage the municipal water system, hydrant components, and fire apparatus.</li><li>A hydrant should take at least <strong>15–30 seconds to fully open</strong> and a similar amount of time to close. The operator must maintain awareness of the pressure changes during this process.</li></ul><h3><strong>IV. SUPPLY METHODS FOR ENGINE OPERATIONS</strong></h3><h4><strong>Hydrant Operations and Equipment:</strong></h4><ul><li>Engines are equipped with <strong>4” supply hose</strong> and a <strong>Hydrant Assist Valve (HAV)</strong> for water supply.</li><li><strong>Gate Valve:</strong> Place a gate valve on one of the 2.5” hydrant discharges before charging the supply line.</li><li>Preferred hydrant connections include:<ul><li><strong>Direct Connection:</strong> Connect the hydrant to the engine with the hydrant assist valve in place.</li><li><strong>Forward Lay:</strong> Lay supply hose from the hydrant to the fireground.</li><li><strong>Reverse Lay:</strong> Lay supply hose from the fireground to the hydrant.</li></ul></li></ul><h4><strong>Static and Residual Pressures:</strong></h4><p>Understanding static and residual pressures helps determine how many additional handlines a hydrant can support. Follow these steps:</p><ol><li><strong>Static Pressure:</strong> Measure static pressure on the intake compound gauge before any water is flowing.</li><li><strong>Residual Pressure:</strong> Measure after charging the first hoseline. Calculate pressure loss.</li><li><strong>Percentage Method:</strong> Determine remaining hydrant capacity:<ul><li><strong>0–10% drop:</strong> Hydrant can supply 3 times the current water flow.</li><li><strong>11–15% drop:</strong> Hydrant can supply 2 times the current water flow.</li><li><strong>16–25% drop:</strong> Hydrant can supply 1 additional line.</li><li><strong>&gt;25% drop:</strong> Limited capacity; no additional lines should be added.</li></ul></li></ol><h4><strong>Large Fire Flows:</strong></h4><p>For significant fire flows, such as high-rise or commercial structure fires:</p><ul><li>Utilize hydrants on separate water mains to maximize water availability.</li><li>Deploy multiple hydrants early in the incident to ensure sustained water supply.</li><li>Ensure that the first two arriving engines establish water supply from different mains.</li></ul><h3><strong>V. STRATEGIC CONSIDERATIONS</strong></h3><ol><li><strong>Water Supply Planning:</strong> Preplan hydrant locations, capacities, and available mains for critical areas (high-rises, industrial, commercial zones).</li><li><strong>Hydrant Assist Valve Use:</strong> Maximize hydrant flow and maintain flexibility for additional connections.</li><li><strong>Monitor Pressures:</strong> The engine operator must monitor both the hydrant and pump panel gauges to avoid residual pressure drops below safe levels.</li><li><strong>Friction Loss Awareness:</strong> Understand friction loss associated with supply hose sizes and flows to maintain efficient water delivery.</li><li><strong>Secondary Hydrants:</strong> Identify and secure secondary hydrants for redundancy in case of hydrant failure or water main issues.</li></ol>",
"2.12":"<h2>Rural Water Supply</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly establish a water supply during fire operations in rural areas where hydrant infrastructure is not available.</p><h3><strong>II. DISCUSSION</strong></h3><p>Historically, rural areas featured smaller structures with limited water demand. Today, modern lightweight construction and buildings exceeding 4,000 square feet require larger and sustained fire flows. The challenge in rural areas is delivering sufficient water to meet fire suppression needs. Water supply operations in rural settings typically consist of one or a combination of the following methods:</p><ol><li><strong>Nursing Operations</strong> (Direct Fill)</li><li><strong>Drop Tank Operations</strong> (Static Water Supply)</li><li><strong>Relay Operations</strong> (Pumped Water Transfer)</li></ol><p>Effective water supply is critical to successful rural firefighting operations. Proper planning, equipment, and execution must be prioritized to overcome water resource limitations.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Structure Fire Water Supply Operations</strong></h4><p>The <strong>standard response</strong> for rural structure fires consists of:</p><ul><li><strong>1 Engine</strong> (primary fire attack)</li><li><strong>1 Tanker</strong> (initial water supply)</li></ul><h4><strong>Method 1: Nursing Operations (Direct Fill)</strong></h4><ul><li>Best suited for <strong>smaller fires</strong> requiring one or two handlines.</li><li>In this method, a <strong>tanker connects directly</strong> to the engine using a <strong>supply line</strong>, supplying water directly to the engine’s drivers side auxiliary inlet.</li><li><strong>Preferred Connection:</strong> Driver’s side auxiliary inlet.</li></ul><h4><strong>Method 2: Drop Tank Operations</strong></h4><p>Drop tank operations are used when <strong>large fire flows</strong> are required. Portable drop tanks provide a water reservoir for tankers to dump water quickly, allowing faster turnaround for additional water supply.</p><h4><strong>Operational Considerations:</strong></h4><ul><li><strong>Call for Additional Tankers:</strong> Two tankers with dump valves <strong>cannot sustain a constant supply</strong> beyond short distances. Additional tankers or shuttle operations must be initiated early.</li><li><strong>Positioning the First Engine:</strong> Stage in a flat, accessible area with sufficient space for: drop tank deployment, tanker access and egress, and additional apparatus placement.</li><li><strong>Remote Drop Site:</strong> If the fireground lacks space, position the drop site in a nearby location with an additional engine relaying water to the primary attack engine.</li><li><strong>Tanker Fill Points:</strong> Identify accessible water sources and preplan member staging for efficient tanker refill operations.</li><li><strong>Water Supply Operations Officer:</strong> Assign a dedicated member to coordinate unloading, refilling, and tanker turnaround.</li></ul><h4><strong>Non-Domestic Water Sources</strong></h4><p>When hydrants are unavailable, firefighters must utilize alternative static water sources.</p><ul><li><strong>Dry Hydrants:</strong> Dry hydrants are installed in <strong>ponds, lakes, streams, or pools</strong> to provide a static water source accessible by fire apparatus.<ul><li>No tested and approved dry hydrants currently exist in PFD’s primary area.</li><li>Proper adapters (e.g., 4½” to 6” double female NPT) must be available for drafting operations.</li><li>Backflush and test dry hydrants <strong>every six months</strong> to ensure operability.</li></ul></li><li><strong>Static Water Sources:</strong> Ponds, lakes, rivers, streams, and swimming pools.<ul><li><strong>Challenges:</strong> Drought (low water levels), Winter (ice requires cutting), Debris (flooding may clog strainers), Swimming Pools (consider potential structural damage vs. firefighting benefit before use).</li></ul></li><li><strong>Key Drafting Tips:</strong> Draft from the <strong>deepest accessible point</strong> in static water sources. Utilize strainers to prevent debris from clogging pumps. Ensure apparatus is positioned on stable, accessible ground for drafting operations.</li></ul><h4><strong>Strategic Considerations</strong></h4><ol><li><strong>Preplanning Water Sources:</strong> Maintain up-to-date maps of potential static water sources, fill points, and access routes.</li><li><strong>Tanker Coordination:</strong> Ensure efficient tanker shuttle rotations and fill-point operations.</li><li><strong>Water Demand:</strong> Evaluate fire flow needs early in the incident to determine if relay or shuttle operations are required.</li><li><strong>Relay Operations:</strong> If multiple drop sites are utilized, assign an additional engine to <strong>relay water</strong> from the drop tank to the primary attack engine.</li></ol><h3><strong>IV. SAFETY CONSIDERATIONS</strong></h3><ol><li>Ensure <strong>safe apparatus positioning</strong> for both drafting and water shuttle operations.</li><li>Maintain clear access/egress routes for tankers to avoid delays or collisions.</li><li>Monitor apparatus for pump cavitation or low tank levels to prevent pump damage.</li><li>Conduct operations with clear communication to streamline tanker movements and drop site logistics.</li></ol>",
"3.1":"<h2>Rehab</h2><h3><strong>I. PURPOSE</strong></h3><p>To ensure the physical and mental condition of firefighters and emergency personnel operating at emergency scenes, training exercises, or other fire department activities does not deteriorate to a level that jeopardizes individual safety, team effectiveness, or incident integrity. For specific limits on vital signs and rehab times, refer to <strong>PFD/EMS Protocols.</strong></p><h3><strong>II. DISCUSSION</strong></h3><p>The physical and mental demands of firefighting and emergency operations, combined with environmental factors such as extreme heat, cold, or hazardous conditions, can cause fatigue, heat stress, or other health risks. Proper rehab ensures responders maintain operational effectiveness and avoid critical incidents caused by physical or mental deterioration. Rehabilitation also mitigates risks such as heat exhaustion, heat stroke, and diminished decision-making abilities due to fatigue.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>General Guidelines</strong></h4><ul><li><strong>Automatic EMS Response:</strong> The standard structure fire response package includes automatic EMS response for rehab and potential victim care.</li><li><strong>Grass Fires:</strong> Standby ambulances are required for incidents expected to last more than one hour or under extreme conditions.</li><li><strong>EMS Role:</strong> EMS provides medical care for responders and victims, including rehab operations. If EMS is unavailable, the Incident Commander (IC) must establish a medical sector to manage responder rehab.</li></ul><h4><strong>Establishing Rehab</strong></h4><ul><li>The rehab area should be located away from smoke, exhaust, and other hazards but close enough to facilitate easy firefighter movement.</li><li>EMS or designated rehab personnel should verify the location and setup needs with the IC upon arrival.</li><li>The area must have seating, hydration resources, and space for PPE removal.</li></ul><h4><strong>Criteria for Rehabilitation</strong></h4><p>Firefighters should report to rehab under any of the following conditions:</p><ul><li>After expending two SCBA cylinders or when an SCBA failure occurs.</li><li>Following 30–45 minutes of strenuous activity.</li><li>Exposure to harsh environments (e.g., extreme heat, cold, or hazardous conditions) for 30–45 minutes.</li><li>Upon exhibiting signs of fatigue, heat stress, or abnormal behavior.</li><li>When directed by the IC.</li></ul><h4><strong>Evaluation Process</strong></h4><ol><li><strong>Initial Assessment:</strong> Remove SCBA, bunker coat, helmet, and hood. Record initial vitals, including heart rate, blood pressure, respiratory rate, and temperature.</li><li><strong>Rehab Period:</strong> Provide a minimum of 10 minutes of rest and at least 8 ounces of water or diluted electrolyte fluids. Reassess and record vitals after 10 minutes.</li><li><strong>Extended Monitoring:</strong> Personnel whose vitals remain outside acceptable limits after 20 minutes should be assessed by EMS personnel for further evaluation and possible transport.</li><li><strong>Field Treatment:</strong> Ill or injured personnel may be treated on-site under PFD/EMS protocols. Releases and refusals must comply with <strong>Refusal of Care Guidelines.</strong> Medical control consultation is required for any refusal following treatment. Personnel who have any specific medical complaint will be assessed and treated for that complaint by EMS.</li></ol><h4><strong>Rehab Termination</strong></h4><ul><li>The IC will release EMS or rehab personnel once their services are no longer required.</li></ul><h4><strong>Communication and Documentation</strong></h4><ul><li><strong>Radio Monitoring:</strong> EMS should monitor tactical channels and communicate directly with the IC.</li><li><strong>Documentation:</strong> Record all rehab operations in the PFD/EMS PCR system. Maintain a rehab log and document all refusals, treat-and-release cases, and transports. Any post-incident medical intervention at the station requires documentation and medical control notification.</li></ul><h3><strong>IV. SPECIAL CONSIDERATIONS</strong></h3><h4><strong>Outside Agencies and Personnel</strong></h4><ul><li>Personnel from other departments must comply with PFD rehab protocols and IC guidance.</li><li>If issues arise with external department personnel refusing rehab, notify the IC with department and apparatus details.</li><li>External personnel requiring treatment or transport must follow medical control instructions.</li></ul><h4><strong>Environmental Considerations</strong></h4><ul><li><strong>Hot Weather:</strong> Prioritize hydration and cooling measures. Use shade, fans, or cooling stations if available.</li><li><strong>Cold Weather:</strong> Ensure warm, dry conditions in the rehab area. Provide blankets or warming devices if needed.</li></ul><h4><strong>Rehab in Prolonged Incidents</strong></h4><ul><li>Assign a dedicated Rehab Officer for extended incidents.</li><li>Rotate personnel through rehab at regular intervals to maintain operational efficiency.</li></ul>",
"3.2":"<h2>Mass Casualty Incident Response</h2><h3><strong>I. PURPOSE</strong></h3><p>To outline procedures for command and control of Fire personnel during mass casualty situations to ensure rapid and efficient treatment and transportation of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>A mass casualty incident (MCI) is defined as “an event that overwhelms the local healthcare system, where the number of casualties vastly exceeds the local resources and capabilities in a short period of time.” Examples of common events where an MCI may be encountered include:</p><ul><li>Motor vehicle accidents with multiple vehicles or public transport buses.</li><li>Tornados and other severe weather events.</li><li>Active shooter (AS) events.</li></ul><p>Active shooter events require close coordination between fire, EMS, and law enforcement (LE) agencies. Local jurisdictions must establish common tactics, communications, and procedures to handle AS/MCI scenarios effectively. The goal is to save the maximum number of lives possible through pre-planned, coordinated efforts.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Identify Incident Scope</strong></h4><p>The PFD/EMS defines three levels of MCI events:</p><ul><li><strong>Level 1 MCI:</strong> 3–5 casualties; at least one critical.</li><li><strong>Level 2 MCI:</strong> 6–15 casualties.</li><li><strong>Level 3 MCI:</strong> 16+ casualties.</li></ul><h4><strong>Level 1 MCI Guidelines</strong></h4><p><strong>Mini-Mass Casualties (MCI-1)</strong> involve 3–5 injured patients with at least one critical case.</p><p><strong>Responsibilities of the First Arriving Apparatus</strong></p><ul><li>Provide an initial radio report, including patient count and additional resource needs.</li><li>Establish or report to incident command (IC).</li><li>Conduct rapid triage using the <strong>START method</strong> and attend to the most critical patient.</li><li>Package patients and assemble them at a central collection point.</li><li>Reevaluate and request additional resources as needed.</li><li>Ensure patient transport is prioritized by severity.</li></ul><p><strong>Standard Exam and Treatment</strong></p><ul><li>Direct walking wounded to the ambulance or a safe area.</li><li>Assess non-walking wounded for:<ul><li>Respiration (&gt;30 breaths/min).</li><li>Perfusion (pulse, cap refill &gt;2 seconds, skin color).</li><li>Mental status (follows commands).</li></ul></li><li>Treat critical issues: airway management, chest wound sealing, major hemorrhage control.</li><li>Move patients to the collection area for further evaluation and transport.</li></ul><h4><strong>Level 2 MCI Guidelines</strong></h4><p><strong>MCI-2</strong> incidents involve 6–15 victims requiring additional Fire and EMS personnel and mutual aid. Recommended personnel and resources:</p><ul><li>1 EMT per critical patient.</li><li>1 EMT per 4 non-critical patients.</li><li>Senior EMTs as Medical Communication and Triage Control Officers.</li><li>Request a Mass Casualty Response from Pafford for the number of patients you have.</li><li>Request that Pafford consider launching air ambulance(s).</li></ul><p><strong>Incident Commander Responsibilities:</strong> Ensure adequate transport vehicles and personnel are requested. Coordinate activation of EMS and mutual aid resources. Assign Triage and Transportation Control Officers.</p><h4><strong>Level 3 MCI Guidelines</strong></h4><p><strong>MCI-3</strong> incidents involve 16+ victims and require extensive regional support. Recommended personnel and resources:</p><ul><li>2 EMT’s per 5 critical patients.</li><li>1 EMT per 10 non-critical patients.</li><li>Request a Mass Casualty Response from Pafford for the number of patients you have.</li><li>Request that Pafford consider launching air ambulance(s).</li></ul><p><strong>Additional Assignments:</strong> Establish a Medical Operations Chief and Public Information Officer. Coordinate with mutual aid for patient transport and hospital notifications.</p><h4><strong>Triage System</strong></h4><p>The primary triage method for PFD/EMS is the <strong>START</strong> and <strong>JUMP/START</strong> systems. All personnel must maintain proficiency in these methods.</p><h4><strong>ICS Assignments</strong></h4><ul><li><strong>Incident Commander:</strong> Establish command as per PFD guidelines. Coordinate with EMS Operations for patient rescue and treatment. Establish staging areas, liaise with external agencies, and designate command positions.</li><li><strong>EMS Operations:</strong> Designate triage, treatment, and transport officers. Oversee all medical operations and request additional resources as needed. Stockpile medical supplies from responding units.</li><li><strong>Triage Officers:</strong> <strong>Primary:</strong> Perform rapid triage and direct lifesaving treatments. <strong>Secondary:</strong> Tag patients, determine transport priorities, and direct to treatment areas.</li><li><strong>Treatment Officer:</strong> Identify and manage patient treatment areas. Assign personnel to treat groups and coordinate transport.</li><li><strong>Loading Officer:</strong> Establish patient loading areas. Record patient information and notify receiving hospitals. Manage ambulance access and egress.</li></ul><h4><strong>Active Shooter Incidents</strong></h4><ul><li><strong>Interagency Coordination:</strong> Establish a unified command post (UCP) with LE presence. Assign all incoming apparatus to Level 1 Staging. Prepare to utilize larger apparatus for shielding. Stage EMS resources at Level 1 Staging. Form Rescue Task Force teams with 2 Fire/EMS providers and 2 LE officers.</li><li><strong>Rescue Team Guidelines:</strong> Enter hot zones for rapid triage and patient removal under LE direction. Assure patient is in recovery position after they have been triaged. Enter warm zone once LE has determined a secure corridor exists. Treat life-threatening injuries (e.g., bleeding control, chest seals) before moving victims to the CCP. Designate and secure a casualty collection point (CCP).</li><li><strong>Command Considerations:</strong> Establish staging and secure areas for families and bystanders. Ensure accountability for responders and victims. Activate regional resources early and request additional medical supplies for the CCP. Designate a Public Information Officer (PIO) to manage media communications carefully.</li></ul><h4><strong>Documentation</strong></h4><ul><li>Record triage, treatment, and transport operations in the PFD/EMS system. Maintain detailed logs of patient movements, treatments, and resource utilization.</li></ul>",
"3.3":"<h2>Medical Equipment Decontamination</h2><h3><strong>I. PURPOSE</strong></h3><p>This policy describes the decontamination procedures for equipment, clothing, and apparatus. It outlines cleaning and disinfecting protocols to mitigate infection risks during emergency medical operations.</p><h3><strong>II. DISCUSSION</strong></h3><p>Proper decontamination of reusable equipment is crucial to prevent infection during emergency treatment. Cleaning removes foreign materials from objects, while disinfecting reduces the presence of harmful microorganisms. Equipment requiring sterilization will be replaced with single-use alternatives and disposed of as contaminated waste post-use.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Equipment Disinfecting</strong></h4><p>Equipment contaminated with blood or Other Potentially Infectious Materials (OPIM) must be cleaned, disinfected, or disposed of appropriately. Members must:</p><ul><li>Wear PPE during decontamination.</li><li>Use disposable paper towels to remove gross contaminants.</li><li>Disinfect surfaces with Super Sani-Cloth® wipes, following manufacturer instructions.</li></ul><p><strong>Daily Checks for Cleanliness:</strong> Oxygen/EMS bags, Spine boards and KED boards, Suction units, Cardiac monitors, Intubation kits.</p><p><strong>Cleaning Recommendations:</strong></p><ul><li><strong>Oxygen/EMS Bags:</strong> Clean with soap and water; maintain orderly contents.</li><li><strong>Spine Boards/KED Boards:</strong> Wash with soap and water; disinfect thoroughly.</li><li><strong>Suction Units:</strong> Remove debris before disinfecting.</li><li><strong>Cardiac Monitors:</strong> Clean cables and exterior; disinfect carrying case.</li><li><strong>Intubation Kits:</strong> Pay special attention to laryngoscope blades and handles.</li></ul><h4><strong>Disposable Equipment</strong></h4><p>Disposable items include: Suction canisters, catheters, and tubing. Head immobilizers, C-collars. Oxygen masks, nebulizers, BVMs. IV/IO catheters, tubing, fluids. Bandaging materials, burn sheets, OB kits. These must be disposed of as contaminated waste.</p><h4><strong>Uniform Disinfection</strong></h4><p>Contaminated clothing must be cleaned as follows:</p><ul><li>Remove and launder contaminated clothing at station PPE washers. Home laundering is discouraged.</li><li>Scrub boots with soap and water, ensuring soles are cleaned after incidents.</li><li>Station footwear should differ from response footwear to avoid contamination.</li></ul><h4><strong>Hand Washing</strong></h4><p>Hand hygiene is critical to preventing infections. Use soap and water or alcohol-based hand sanitizers when washing facilities are unavailable.</p><p><strong>Recommended Procedure:</strong></p><ol><li>Wet hands up to 2-3\" above wrists.</li><li>Apply soap; scrub all surfaces for 15 seconds.</li><li>Rinse hands downward to allow water to flow off fingertips.</li><li>Dry hands thoroughly with a clean paper towel.</li><li>Use a towel to turn off the faucet.</li></ol><p><strong>Hand Sanitizers:</strong> Available in all apparatus and stations, use as needed when soap and water are unavailable.</p><h4><strong>Medical Waste Disposal</strong></h4><p><strong>Categories of Medical Waste:</strong></p><ol><li><strong>Contaminated Waste:</strong> Dispose of in red biohazard bags.</li><li><strong>Sharps:</strong> Secure full sharps containers before disposing of them appropriately.</li><li><strong>Non-Contaminated Waste:</strong> Discard in regular garbage.</li></ol><h4><strong>Apparatus Decontamination</strong></h4><p>All contaminated apparatus surfaces must be cleaned and disinfected immediately. Inspect for contamination during daily apparatus checks. Weekly thorough disinfection is mandatory.</p><p><strong>Decontamination Process:</strong> Use Super Sani-Cloth® wipes for cleaning contaminated surfaces. Follow up with weekly comprehensive cleaning as part of apparatus inspections.</p>",
"4.1":"<h2>Motor Vehicle Accident</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish a standardized approach for fire department response to motor vehicle accidents (MVAs) to ensure the safety of all personnel, efficient operations, and effective management of incidents to protect lives, property, and the environment.</p><h3><strong>II. DISCUSSION</strong></h3><p>Motor vehicle accidents are dynamic and potentially hazardous situations that involve multiple factors, including traffic, hazardous materials, extrication needs, and medical emergencies. Responders must be prepared to address life safety, scene stabilization, hazard mitigation, and coordination with other agencies.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond to all MVAs with due regard for safety and traffic laws. Gather all relevant information from dispatch, including location, number of vehicles, injuries, and potential hazards (e.g., hazardous materials).</li><li><strong>Apparatus Positioning:</strong> Position apparatus to provide a safe work zone, using the vehicle as a shield between responders and traffic. Utilize traffic cones, signs, and warning lights for additional safety. Avoid blocking access for additional emergency vehicles unless necessary for scene safety.</li><li><strong>Establish Incident Command:</strong> The first arriving officer shall assume command and provide an initial size-up, including: Number of vehicles involved, number and severity of injuries, any hazards present (e.g., fire, fluids, downed power lines). Announce the need for additional resources if necessary.</li></ol><h4><strong>Life Safety Priorities</strong></h4><ol><li><strong>Scene Safety:</strong> Ensure all responders are in full PPE, including high-visibility vests. Assign a safety officer if resources allow. Mitigate traffic hazards by working with law enforcement to divert or control traffic.</li><li><strong>Medical Assessment and Treatment:</strong> Follow the principles of triage for multiple patients: Immediate life-saving care. Stabilize and treat as necessary while awaiting transport. Provide basic life support (BLS) or advanced life support (ALS) care in coordination with EMS.</li><li><strong>Extrication:</strong> Assess the need for extrication tools and procedures. Stabilize vehicles using cribbing, chocks, or struts before initiating extrication. Coordinate closely with EMS to prioritize patient care during extrication. Use proper tools and techniques to avoid further injury to patients or responders.</li></ol><h4><strong>Fire and Hazard Mitigation</strong></h4><ol><li><strong>Fire Suppression:</strong> Deploy charged hose line (minimum 1-1/2”) if there is an active fire with heavy involvement or a booster for a threat of fire or small fire. Use foam or dry chemical extinguishers for flammable liquid spills if necessary.</li><li><strong>Hazard Control:</strong> Identify and address hazardous materials (e.g., fuel leaks, cargo spills). Ensure vehicle electrical systems are deactivated by disconnecting batteries (negative cable first). Avoid contact with airbags, as they may still deploy. Request specialized resources for hazardous materials as needed.</li></ol><h4><strong>Scene Stabilization and Coordination</strong></h4><ol><li><strong>Communication:</strong> Maintain clear communication with all responding agencies. Provide updates to Incident Command as conditions change.</li><li><strong>Traffic Control:</strong> Coordinate with law enforcement to establish safe zones for operations. Utilize additional personnel or equipment to ensure traffic control measures are maintained.</li><li><strong>Environmental Protection:</strong> Contain and manage fluid spills to prevent environmental contamination. Notify appropriate environmental agencies if spills cannot be contained.</li></ol><h4><strong>Documentation and Reporting</strong></h4><ol><li><strong>Post-Incident Reporting:</strong> Complete a detailed incident report, including: Time and location, Actions taken, Injuries or fatalities, Damage assessment, Hazards encountered and mitigated.</li><li><strong>Equipment and Personnel Check:</strong> Inspect and service all equipment used during the incident. Replenish supplies and return apparatus to a state of readiness. Conduct a debriefing to review incident performance and identify areas for improvement.</li></ol>",
"4.2":"<h2>Confined Space Rescue</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish a standardized approach for fire department response to confined space rescues to ensure the safety of responders, efficient operations, and the successful recovery of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>Confined space rescues present unique challenges due to restricted access, limited visibility, hazardous atmospheres, and potential structural instability. Confined spaces are defined by OSHA as areas that are large enough for an employee to enter, have limited means of entry or exit, and are not designed for continuous occupancy. Rescuers must ensure their safety and adhere to specialized protocols when addressing such incidents.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond to all confined space rescues with due regard for safety and urgency. Gather relevant information from dispatch.</li><li><strong>Incident Command:</strong> The first arriving officer shall establish Incident Command (IC) and provide an initial size-up: Nature of the emergency, Number of victims and their condition, Identification of potential hazards. Notify additional resources, including technical rescue teams and hazardous materials (HAZMAT) units, as needed.</li><li><strong>Initial Size-Up:</strong> Identify and evaluate: Type and configuration of the confined space, Presence of hazardous materials or gases, Structural stability of the space, Accessibility for rescue operations. Secure the scene and control access.</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> All responders must don appropriate Personal Protective Equipment (PPE), including helmets, gloves, and confined space-rated harnesses.</li><li><strong>Atmospheric Monitoring:</strong> Conduct continuous monitoring for oxygen levels, flammable gases, and toxic substances using a multi-gas detector. Maintain a safe atmosphere with ventilation if possible.</li><li><strong>Two-In/Two-Out Rule:</strong> Always ensure two personnel are inside the confined space and two personnel are on standby outside, ready to perform rescue if necessary.</li><li><strong>Lockout/Tagout:</strong> Ensure all energy sources (electrical, mechanical, hydraulic, pneumatic) are locked out and tagged out to prevent accidental activation during the rescue.</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Access and Entry:</strong> Establish safe entry points and use tripod or other confined space entry systems for vertical access. Ensure all rescuers are tethered to lifelines monitored by personnel outside the space.</li><li><strong>Victim Assessment:</strong> Quickly assess the condition of the victim(s): Consciousness and ability to communicate, Breathing and circulation, Potential injuries. Provide immediate care as conditions allow.</li><li><strong>Extrication:</strong> Utilize approved retrieval systems, such as rope and pulley systems, for safe victim removal. Maintain communication with the victim and rescuers at all times.</li><li><strong>Hazard Mitigation:</strong> Ventilate the confined space to improve atmospheric conditions. Use absorbent materials to manage spills and leaks. Coordinate with HAZMAT teams if hazardous materials are present.</li></ol><h4><strong>Post-Rescue Operations</strong></h4><ol><li><strong>Medical Care:</strong> Transfer victims to EMS for advanced medical evaluation and treatment. Provide decontamination for victims and rescuers if hazardous materials are involved.</li><li><strong>Debriefing:</strong> Conduct a post-incident review to evaluate effectiveness, safety practices, and areas for improvement.</li><li><strong>Equipment Inspection:</strong> Inspect all equipment used during the operation for damage or contamination. Clean and service equipment before returning it to service.</li></ol>",
"4.3":"<h2>Trench Rescue</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish a standardized approach for fire department response to trench rescue incidents to ensure the safety of all personnel, efficient operations, and the successful rescue of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>Trench rescues present unique hazards, including unstable soil, confined spaces, and potential collapse. These incidents require specialized equipment and highly trained personnel. This guideline outlines procedures to ensure the safety of responders and victims during trench rescue operations.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond to all trench rescues with due regard for safety. Gather relevant information from dispatch (location, victims, hazards).</li><li><strong>Incident Command:</strong> Establish Incident Command (IC) and provide initial size-up. Notify specialized trench rescue teams and additional resources as needed.</li><li><strong>Initial Size-Up:</strong> Evaluate and secure the scene: Ensure bystanders and non-essential personnel are moved to a safe distance. Stop all work and heavy equipment near the trench to prevent vibrations. Establish an exclusion zone around the trench with a minimum distance of twice the depth of the trench.</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> All personnel must don appropriate PPE. No personnel shall enter an unshored or unstable trench.</li><li><strong>Hazard Identification:</strong> Continuously monitor the trench for signs of further collapse, water or hazardous materials, and underground utilities (coordinate for shutoff).</li><li><strong>Atmospheric Monitoring:</strong> Monitor for oxygen levels, toxic gases, and flammable substances. Provide ventilation if atmospheric hazards are detected.</li></ol><h4><strong>Stabilization and Shoring Operations</strong></h4><ol><li><strong>Trench Stabilization:</strong> Ensure shoring is installed under the supervision of a trained trench rescue technician. Secure spoil piles at least 2 feet from the edge of the trench.</li><li><strong>Shoring Procedures:</strong> Begin shoring at the top of the trench and work down. Ensure all responders entering the trench are tethered to lifelines. Use ladders for safe access and egress, placing them every 25 feet within the trench.</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Victim Assessment and Access:</strong> Conduct a visual assessment before entering. Provide immediate care as conditions allow.</li><li><strong>Extrication:</strong> Use approved lifting and stabilization equipment for safe extrication. Communicate continuously with victims and rescue personnel.</li><li><strong>Hazard Mitigation:</strong> Address any hazards such as water intrusion or unstable shoring immediately. Coordinate with HAZMAT teams if hazardous materials are present.</li></ol><h4><strong>Post-Rescue Operations</strong></h4><ol><li><strong>Medical Care:</strong> Transfer victims to EMS. Provide decontamination if necessary.</li><li><strong>Debriefing:</strong> Conduct a post-incident review.</li><li><strong>Equipment Inspection:</strong> Inspect, clean, and service all equipment.</li></ol>",
"4.4":"<h2>Rope Rescue</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish standardized procedures for fire department response to high and low angle rope rescue incidents to ensure the safety of responders, operational efficiency, and the successful recovery of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>High and low angle rope rescues involve vertical or steep-angle terrain that requires specialized techniques and equipment to safely access and extricate victims. These operations demand well-coordinated efforts and adherence to safety protocols to protect both rescuers and victims.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond with due regard for safety and urgency. Gather relevant information from dispatch (terrain, victims, hazards).</li><li><strong>Incident Command:</strong> Establish Incident Command (IC) and provide initial size-up. Notify specialized rope rescue teams and additional resources as needed.</li><li><strong>Initial Size-Up:</strong> Evaluate the scene and secure the area: Ensure bystanders are moved to a safe distance. Identify potential anchor points and access routes.</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> All personnel must don appropriate PPE, including helmets, gloves, and harnesses rated for rope rescue operations. Use only certified rope rescue equipment.</li><li><strong>Scene Security:</strong> Establish an exclusion zone around the rescue area. Assign a safety officer to monitor operations.</li><li><strong>Hazard Assessment:</strong> Continuously monitor the area for hazards (falling debris, unstable terrain, weather changes).</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Anchor Systems:</strong> Identify and establish secure anchor points capable of supporting the required load. Use redundant anchor systems to ensure safety.</li><li><strong>Rope Systems:</strong> High angle rescues (&gt;60°): Utilize a two-rope system (main line and belay line) for all operations. Low angle rescues (&lt;60°): Employ a single rope system with safety measures as appropriate.</li><li><strong>Victim Access:</strong> Deploy trained personnel to access the victim using rappelling/ascending techniques (high angle) or rope and stretcher systems (low angle). Ensure continuous communication.</li><li><strong>Extrication:</strong> Package the victim using appropriate equipment (e.g., stokes basket, harnesses). Ensure all attachment points are secure before beginning the lift or lower operation. Coordinate movements with all team members to maintain control.</li><li><strong>Team Communication:</strong> Use standardized hand signals or radios to maintain clear communication.</li></ol><h4><strong>Post-Rescue Operations</strong></h4><ol><li><strong>Medical Care:</strong> Transfer victims to EMS. Provide decontamination if necessary.</li><li><strong>Debriefing:</strong> Conduct a post-incident review.</li><li><strong>Equipment Inspection:</strong> Inspect all equipment used during the operation for damage or wear. Clean and service equipment before returning it to service.</li></ol>",
"4.5":"<h2>Structural Collapse</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish standardized procedures for fire department response to structural collapse incidents to ensure responder safety, effective operations, and the successful rescue of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>Structural collapses present a range of hazards, including unstable debris, secondary collapses, and hazardous materials. These incidents demand specialized training, equipment, and coordination among multiple agencies. This guideline outlines procedures for mitigating risks and conducting safe and efficient rescues.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond with due regard for safety. Gather relevant info from dispatch (type of structure, victims, hazards).</li><li><strong>Incident Command:</strong> Establish IC and provide initial size-up. Notify technical rescue teams and additional resources as needed.</li><li><strong>Initial Size-Up:</strong> Secure the scene: Evacuate and account for all non-essential personnel. Establish an exclusion zone around the collapse area. Identify hazards (secondary collapses, utilities, hazardous materials).</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> All personnel must don appropriate PPE (helmets, gloves, eye protection, steel-toe boots). Use only approved structural collapse rescue equipment.</li><li><strong>Hazard Mitigation:</strong> Shut off utilities in coordination with utility providers. Continuously monitor for secondary collapses and shifting debris. Establish atmospheric monitoring.</li><li><strong>Scene Security:</strong> Assign a safety officer to oversee operations and enforce safety protocols. Limit access to authorized personnel only.</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Search and Reconnaissance:</strong> Conduct a thorough search of the collapse area using visual/auditory signals, search cameras, and acoustic devices.</li><li><strong>Shoring and Stabilization:</strong> Stabilize the structure using cribbing, pneumatic shoring, or other approved methods. Ensure stabilization measures are inspected by a trained technician before entry.</li><li><strong>Victim Access:</strong> Prioritize victim locations based on survivability profile and accessibility. Use approved tools and techniques to access victims safely.</li><li><strong>Victim Extrication:</strong> Provide immediate medical care as conditions allow. Package victims using appropriate equipment. Coordinate movements to prevent further injury.</li><li><strong>Team Communication:</strong> Use standardized hand signals or radios.</li></ol><h4><strong>Post-Rescue Operations</strong></h4><ol><li><strong>Medical Care:</strong> Transfer victims to EMS. Provide decontamination if necessary.</li><li><strong>Debriefing:</strong> Conduct a post-incident review.</li><li><strong>Equipment Inspection:</strong> Inspect, clean, and service all equipment.</li></ol>",
"4.6":"<h2>Water Rescue (NON Dive Incidents)</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish standardized procedures for fire department response to water rescue incidents involving non-dive operations, ensuring responder safety, effective operations, and successful rescue of victims.</p><h3><strong>II. DISCUSSION</strong></h3><p>Water rescues present unique challenges, including rapid water currents, limited access to victims, and environmental hazards. Non-dive operations focus on the use of surface rescue techniques and equipment to safely recover victims from water without requiring underwater operations.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond with due regard for safety and urgency. Gather relevant info (water body type, victims, hazards).</li><li><strong>Incident Command:</strong> Establish IC and provide initial size-up. Notify specialized swift water rescue teams as needed.</li><li><strong>Initial Size-Up:</strong> Secure the scene (exclusion zone, staging areas). Identify hazards (water temperature, submerged objects, electrical hazards).</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> All personnel must don appropriate PPE, including Personal Flotation Devices (PFDs) and water rescue helmets. Use only approved equipment.</li><li><strong>Scene Security:</strong> Assign a safety officer. Monitor environmental conditions (water flow, weather).</li><li><strong>Hazard Mitigation:</strong> Ensure all personnel are tethered when working near or in the water. Continuously evaluate for additional hazards.</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Victim Location and Assessment:</strong> Identify victim location and condition. Use binoculars, drones, or boats to enhance visibility.</li><li><strong>Rescue Techniques:</strong><ul><li><strong>Reach:</strong> Use tools such as poles, throw bags, or ropes.</li><li><strong>Throw:</strong> Deploy throw bags from a safe position.</li><li><strong>Row:</strong> Use department boats or inflatable craft.</li><li><strong>Go:</strong> As a last resort, deploy trained surface rescue personnel tethered to a safety line to physically retrieve the victim.</li></ul></li><li><strong>Victim Extrication:</strong> Secure the victim using flotation devices or rescue harnesses. Carefully manage the extrication. Transfer to EMS.</li><li><strong>Team Communication:</strong> Use standardized hand signals or radios.</li></ol><h4><strong>Post-Rescue Operations</strong></h4><ol><li><strong>Medical Care:</strong> Administer basic life support. Monitor for hypothermia.</li><li><strong>Debriefing:</strong> Conduct post-incident review.</li><li><strong>Equipment Inspection:</strong> Inspect, clean, and service equipment.</li></ol>",
"4.7":"<h2>Lock In / Lock Out</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish standardized procedures for fire department response to lock-in/lock-out incidents, ensuring the safety and well-being of victims while maintaining property protection and operational efficiency.</p><h3><strong>II. DISCUSSION</strong></h3><p>Lock-in/lock-out incidents can pose significant risks, especially in extreme weather conditions. Immediate action is required when a child or animal is locked in a vehicle. The fire department prioritizes victim safety while minimizing property damage whenever possible.</p><h3><strong>III. SCOPE AND LIMITATIONS</strong></h3><p>The fire department will provide lock in / lock out services as long as:</p><ul><li>The owner of the property is on site and has signed the liability waiver.</li><li>The situation poses a risk to life or health (e.g., extreme temperatures or a medical emergency).</li></ul><h3><strong>IV. GUIDELINE</strong></h3><h4><strong>Initial Response</strong></h4><ol><li><strong>Dispatch and Response:</strong> Respond to all lock-in/lock-out incidents involving children or animals in vehicles with due regard for safety and urgency. If no children or animals are in vehicles, this shall be a non emergency response. Gather relevant information from dispatch.</li><li><strong>Incident Command:</strong> Establish IC and provide initial size-up. Confirm presence of child/animal. Assess environmental conditions. Notify EMS/animal control if needed.</li></ol><h4><strong>Safety Considerations</strong></h4><ol><li><strong>Responder Safety:</strong> Use appropriate PPE. Park apparatus to protect scene from traffic.</li><li><strong>Victim Safety:</strong> Prioritize rapid access to the victim if they show signs of distress. Monitor continuously until access is achieved.</li></ol><h4><strong>Rescue Operations</strong></h4><ol><li><strong>Non-Destructive Entry:</strong> Attempt to gain entry using non-destructive techniques if time permits and conditions allow (e.g. lock-out kits).</li><li><strong>Forced Entry:</strong> If non-destructive entry is not feasible or the victim’s condition is deteriorating, use the least destructive means to gain access: Break a window away from the victim, ensuring their safety from glass shards.</li><li><strong>Victim Care:</strong> Once access is achieved, immediately assess and treat the victim. Provide BLS as needed. Transfer animals to appropriate care.</li></ol><h4><strong>Post-Incident Procedures</strong></h4><ol><li><strong>Scene Security:</strong> Secure the vehicle and ensure the owner or law enforcement is present before leaving the scene.</li><li><strong>Reporting:</strong> Document the incident in detail (method of entry, property damage). Notify Fire Chief if significant damage occurs or victim is injured.</li><li><strong>Debriefing:</strong> Conduct post-incident review.</li></ol>",
"5.1":"<h2>Rapid Intervention Team</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to conduct Rapid Intervention Team (RIT) operations safely, efficiently, and effectively at incidents involving IDLH atmospheres.</p><h3><strong>II. DISCUSSION</strong></h3><p>Rapid Intervention Teams are essential for firefighter safety and survival. A properly equipped and trained RIT enables the Incident Commander (IC) to prepare for and address firefighter emergencies effectively.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) General Responsibilities of the Rapid Intervention Team (RIT)</strong></h4><ul><li>A RIT is the primary rescue team for locating and rescuing downed or missing fire fighters.</li><li>Minimum staffing for RIT is two (2) members. Increase staffing to four (4) members as soon as resources allow.</li><li>RIT members report to the IC or the appropriate supervisor as directed.</li><li>If the IC uses the RIT for interior operations, the RIT must be replaced immediately.</li><li>The IC must be familiar with related SOPs, including <strong>5.2 Accountability</strong> and <strong>5.3 Mayday</strong>.</li></ul><h4><strong>2) Incidents Requiring a RIT</strong></h4><ul><li>Any incident where members operate in an IDLH or hazardous atmosphere, including:</li><li><strong>Working Fires:</strong> Single and multi-family dwellings, high-rise or large commercial buildings (may require multiple RITs).</li><li><strong>Confined Space Incidents</strong></li><li><strong>High-hazard/Large-scale Incidents</strong> (as determined by the IC or Operations Section Chief).</li></ul><h4><strong>3) RIT Responsibilities and Equipment</strong></h4><p><strong>Responsibilities:</strong> Monitor assigned operational radio channels. Maintain readiness for immediate deployment. Perform additional exterior fireground tasks only if they do not compromise readiness.</p><p><strong>Required Equipment:</strong></p><ul><li>Full PPE for all members.</li><li>Thermal Imaging Camera (TIC).</li><li>Hand lights (one per member).</li><li>Portable radios (one per member).</li><li>RIT Pak (one per trapped firefighter).</li><li>Search rope.</li><li>Basic tools: Halligan bar, flat-head axe, and incident-specific tools as needed.</li></ul><h4><strong>4) Search and Rescue Considerations</strong></h4><ul><li><strong>Pre-deployment Preparations:</strong> Evaluate air management, monitor fatigue, open/unlock exterior doors, remove security bars, ladder the building, ensure utilities controlled.</li><li><strong>Search Plan Development:</strong> Identify entry points, pinpoint last known location, assign tasks, monitor air supply.</li><li><strong>Recommended Search Actions:</strong> Begin in the area of last known location. Follow hose lines and search ropes systematically. Prioritize hallways, then interior rooms, then large spaces using a grid pattern.</li></ul><h4><strong>5) Indicators and Actions for Locating Missing/Trapped Firefighters</strong></h4><ul><li><strong>Signs of a Missing Firefighter:</strong> Look for visible indicators. Listen for PASS device tones, radio traffic, shouts, tapping noises.</li><li><strong>Rescue Actions:</strong> Notify IC immediately upon locating. Silence PASS device and assess condition. Administer air supply via RIT Pak. Package for removal. Provide continuous updates.</li></ul><h4><strong>6) Rescue Plan Development and Execution</strong></h4><ul><li><strong>Plan Development:</strong> Determine resources needed for extraction. Address air supply, packaging, egress routes.</li><li><strong>Execution:</strong> Attach a search rope to the firefighter if the search crew must exit due to low air. Deploy additional crews for extraction as needed.</li></ul><h4><strong>7) Additional Considerations</strong></h4><ul><li>Multiple crews may be required for extended rescues. Initial RIT deployment focuses on locating and stabilizing. Subsequent teams may be needed for extraction.</li></ul>",
"5.2":"<h2>Fireground Accountability</h2><h3><strong>I. PURPOSE:</strong></h3><p>To establish procedures to maintain personnel accountability at emergency scenes.</p><h3><strong>II. DISCUSSION:</strong></h3><p>All personnel involved at the strategic, tactical, or task level of an incident must make a strong commitment to follow all procedures regarding accountability.</p><h3><strong>III. GUIDELINE:</strong></h3><ul><li><strong>Tags:</strong> Personnel will keep an accountability tag with their PPE, normally under their helmet.</li></ul><h4><strong>Initial Tag In:</strong></h4><ul><li><strong>Personnel Responding in apparatus:</strong> All personnel responding in apparatus shall place their tags on the apparatus passport. This passport shall remain with the apparatus unless level two accountability is established.</li></ul><h4><strong>Level One Accountability:</strong></h4><p>Level one accountability is intended to provide a listing of all personnel currently at an incident scene and is the minimum accountability level. This level is normally appropriate for non-alarm activation and initial alarm level activations. This will consist of the responding firefighters having their tag on the correct passport and the passport remaining with the truck.</p><p>Personnel reporting directly to the incident will do so on their assigned apparatus.</p><h4><strong>Level Two Accountability:</strong></h4><p>Level two accountability is intended to account not only for all personnel on scene, but also where they are and what they are doing during expanding incidents. This provides specific accountability for personnel operating in a hazard zone. This level is initiated at the direction of the incident commander and is normally appropriate for operations at alarms requiring “all hands” or greater, when operations extend to requiring a SCBA bottle change prior to the incident being placed “under control” or as otherwise determined by the IC. Prior to initiating level two accountability the IC or if assigned the operations section chief shall retain the responsibility for tracking the location of personnel on scene. All apparatus passports and individual tags shall be moved to the incident command post or designated area upon level two activation.</p><p>Mayday events require the immediate change to level two accountability and the assignment of an accountability officer.</p><h4><strong>Accountability Officer:</strong></h4><p>Upon initiation of level two accountability, an accountability officer shall be assigned. Normally IC will assume this role however if the scene complexity deems it necessary a single member may be assigned to accountability.</p><h4><strong>Personal Accountability Report (PAR) Procedure:</strong></h4><p>Every 15 minutes, during offensive operations, the IC or safety officer should initiate a PAR. The IC will call all Division and Group Officers and ask them to if they have a PAR. The officer of the division/group should respond the he or she has a PAR and also provides the number of people accounted for including the officer. For example: “Division 2 has a PAR with 4” this would mean the officer and 3 firefighters. The number should match up with the corresponding passport. If at any point the PAR finds someone missing, then SOG “Mayday” should be initiated. The IC may do a PAR at anytime during the event.</p><h4><strong>Unit Demobilization:</strong></h4><p>When a unit is cleared from the scene the Apparatus Passport(s) and Accountability Tags will be returned to the company officer after they check out with the Accountability Officer. Apparatus Passports will be returned to the apparatus and Accountability Tags returned to personnel as appropriate.</p>",
"5.3":"<h2>Mayday</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly manage the rescue of lost, trapped, or distressed firefighters. It will also provide basic guidelines for firefighters to follow if they become lost or trapped.</p><h3><strong>II. DISCUSSION:</strong></h3><p>The rescue of lost, trapped, or distressed firefighters is time sensitive. There is a very narrow window of survivability for a firefighter who is out of air, trapped by approaching fire, trapped by structural compromise/collapse, or otherwise unable to exit an IDLH atmosphere. The Incident Commander (IC) must restructure the strategy, tactics and action plan to include a high priority rescue effort.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Mayday Radio Message/Declaring a Mayday</strong></h4><ol><li>The radio message \"Mayday, Mayday, Mayday\" will be used in the following situations:<ul><li>By a member who is lost, trapped, or in need of assistance.</li><li>By a company officer, division/group officer or any member who cannot account for an assigned firefighter who is operating in the fire, Hot Zone, or IDLH atmosphere.</li><li>By a member who witnesses or has confirmed that a firefighter is lost, trapped, or in trouble.</li><li>By a company officer who is unable to locate/account for a suspected lost member.</li></ul></li><li>Any reported mayday will receive priority radio traffic.</li><li>The term mayday will be used to report lost or trapped firefighters ONLY.</li><li>The term \"urgent message\" will be used to report other emergencies.</li></ol><h4><strong>INCIDENT COMMANDER GUIDELINES</strong></h4><p>The IC must ALWAYS assume that the missing firefighter is lost or trapped in a building until the firefighter is located. The IC must make rapid decisions to increase survivability. The following is a list of actions the IC must take after receiving a mayday or a report of a missing or trapped firefighter.</p><ol><li><strong>Broadcast a notification message:</strong> After the mayday declaration, the IC will broadcast a mayday notification message to alert all operating units.</li><li><strong>Obtain “LUNAR” from the firefighter:</strong><ul><li><strong>L</strong> - Location</li><li><strong>U</strong> - Unit number</li><li><strong>N</strong> - Name</li><li><strong>A</strong> - Assignment (What was FF doing? Where was FF operating?)</li><li><strong>R</strong> - Resources (What does FF need?)</li></ul></li><li><strong>Commit the Rapid Intervention Team (RIT) and establish additional RITs:</strong><ul><li>The IC should immediately send in the RIT to initiate search and rescue efforts.</li><li>Establish additional RITs – at least one to replace the initial RIT making entry.</li></ul></li><li><strong>Request additional units and personnel:</strong><ul><li>Request additional personnel as needed.</li><li>Level Two Accountability should be implemented (see SOG 5.2).</li></ul></li><li><strong>Maintain communications:</strong><ul><li>If contact has been made, the IC must remain in continuous communication.</li><li>Option 1: Maintain the rescue effort on the currently assigned Ops channel.</li><li>Option 2: Have all Companies on scene change to another Ops channel, leaving the trapped FF and rescue on the original channel.</li></ul></li><li><strong>Change the strategy - shift to a high priority rescue effort:</strong><ul><li>A rapid rescue plan must be developed.</li><li>Assign an officer as the Rescue Group Supervisor to coordinate operations.</li></ul></li><li><strong>Conduct fireground accountability:</strong><ul><li>Call for a Personnel Accountability Report (PAR) of all companies.</li><li>If not already established, assign an Accountability Officer.</li></ul></li><li><strong>DO NOT abandon firefighting positions, provide reinforcement:</strong><ul><li>Take aggressive measures to protect trapped firefighters from the fire.</li><li>Keep the fire out
