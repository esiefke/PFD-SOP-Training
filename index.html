 of the rescue area and provide appropriate ventilation and lighting.</li></ul></li><li><strong>Assign a Safety Officer:</strong><ul><li>Assign a Safety Officer to monitor activity and evaluate safety.</li></ul></li><li><strong>Assign critical fireground tasks:</strong><ul><li>Open/unlock doors (when appropriate).</li><li>Ventilate the Structure and Provide Lighting.</li><li>Monitor the structural stability of the building.</li></ul></li><li><strong>Ensure Strong Supervision:</strong><ul><li>Supervision and control of activities is required by all line officers.</li><li>Provide crowd control of any nonessential personnel.</li></ul></li></ol><h4><strong>FIREFIGHTER BASIC SELF SURVIVAL GUIDELINES</strong></h4><p>The following are basic guidelines for firefighters to follow if they become lost or trapped in a building.</p><ol><li><strong>Call for help immediately:</strong> Firefighters who find themselves lost/trapped/out of air must immediately announce their situation while continuing to search for a way out.</li><li><strong>Send a mayday radio message and provide a “LUNAR” report:</strong> Use \"Mayday, Mayday, Mayday\". If you cannot reach anyone, switch channels to attempt contact.</li><li><strong>Provide LUNAR:</strong> Location, Unit, Name, Assignment, Resources.</li><li><strong>Activate the PASS device:</strong> Turn it on to sound the audible tone.</li><li><strong>Maintain crew integrity:</strong> Crews that stay intact enhance their chances of being rescued.</li><li><strong>Follow the hose or search rope out:</strong> Remember \"Smooth, Bump, Bump to the Pump\" (male couplings lead to the outside).</li><li><strong>Search for an exit:</strong> Attempt to reach an exterior wall. Search for doorways, windows, and hallways.</li><li><strong>Retreat to a safe refuge:</strong> If a room is away from the fire, move there and advise the IC.</li><li><strong>Stay calm and conserve air:</strong> Control breathing and pace physical activity.</li><li><strong>Assume a horizontal position:</strong> If unable to get out, lay horizontally to maximize PASS visibility/audibility.</li><li><strong>Use flashlight/make tapping noises:</strong> Point flashlight toward the ceiling and make tapping noises.</li></ol>",
"5.4":"<h2>Emergency Vehicle Operations</h2><h3><strong>I. PURPOSE:</strong></h3><p>This guideline defines the emergency vehicle response expectations of the Piedmont Fire Department.</p><h3><strong>II. DISCUSSION:</strong></h3><p>This guideline is applicable to any PFD authorized emergency vehicle responding in emergency mode (Code 3). At all other times PFD authorized emergency vehicles must operate as a normal (i.e., non-emergency) vehicle. Specific sections of the Oklahoma statutes Title 47 set forth the boundaries by which emergency vehicles can be operated.</p><h3><strong>III. GUIDELINE:</strong></h3><p>1) The following is an overview of the applicable Oklahoma regulations regarding emergency vehicle operation applicable to the PFD.</p><ul><li>A. The driver of an authorized emergency vehicle, when responding to an emergency call but not upon returning from a fire alarm, may exercise the privilege set forth in this section, but subject to the conditions herein stated.</li><li>B. The driver of an authorized emergency vehicle may:<ul><li>a. Park, or stand, irrespective of the provisions of this chapter.</li><li>b. Proceed past a red or stop signal or stop sign, but only after slowing down as may be necessary for safe operation.</li><li>c. Exceed the maximum speed limits so long as speeding does not endanger life or property.</li><li>d. Disregard regulations governing direction of movement.</li><li>e. Disregard regulations governing turning in specified directions.</li></ul></li><li>C. The exemptions herein granted to the driver of an authorized emergency vehicle shall apply only when the driver is properly and lawfully making use of an audible signal or of flashing red or blue lights or a combination of flashing red and blue lights.</li><li>D. The provisions of this section shall not relieve the driver of an authorized emergency vehicle from the duty to drive with due regard for the safety of all persons, nor shall such provisions protect the driver from the consequences of reckless disregard for the safety of others.</li></ul><p>2) Along with the forementioned state statutes PFD members operating emergency vehicles shall follow the following guidelines:</p><ul><li>a) Sirens and other audible warning devices will be sounded at all times while responding in emergency mode. Audible warning devices should be turned off upon arrival on an incident scene.</li><li>b) Headlights will operate at all times while emergency vehicles are being driven. Emergency warning lights should be operated during emergency response and while the emergency vehicle is functioning at an incident scene in the roadway.</li><li>c) Speed of emergency vehicles.<ul><li>Exceeding the posted speed limit while traveling to an emergency should be determined by the due regard for the safety of others.</li><li>This exemption will not, however, protect the driver of any vehicle from consequence of a reckless disregard of the safety of others.</li><li>The posted speed limit should be adhered to during inclement weather.</li></ul></li><li>d) Cell phones shall not be used by the driver during any emergency response.</li><li>e) All emergency vehicles will come to a complete stop, or to a speed that will allow the emergency vehicle to immediately stop, if necessary, when entering a red-light intersection, stop sign intersection, or traveling the wrong direction on streets.</li><li>f) The driver will ensure that the right-of-way has been yielded when crossing multi-lane intersections or streets, by “clearing” the lanes one at a time. If visibility is obscured, then do not cross the lane until it is clear.</li><li>h) The driver should avoid passing other responding emergency vehicles while responding to an incident.</li><li>i) When two or more emergency vehicles arrive at the same location together, the emergency vehicle having the right-of-way should proceed first.</li></ul>",
"6.1":"<h2>Hazmat Incidents</h2><h3><strong>I.PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for fire department personnel when responding to hazardous materials (HazMat) incidents within the scope of operations-level training.</p><h3><strong>II.DISCUSSION</strong></h3><p>Operations-level responders are trained to recognize hazardous materials incidents, isolate and deny entry to the area, and take defensive actions to protect life, property, and the environment. The focus is on containment, incident stabilization, and ensuring responder and public safety without entering hazardous environments or conducting technical mitigation.</p><h3><strong>III.GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Assessment</strong></h4><ul><li><strong>Dispatch and Arrival:</strong> Respond promptly. Gather incident information (material involved, location, victims).</li><li><strong>Size-Up:</strong> Establish Incident Command (IC) upon arrival. Identify hazardous materials using placards, container shapes, or ERG. Assess weather and wind conditions. Determine exclusion zones.</li><li><strong>Notifications:</strong> Notify local and regional HazMat teams or mutual aid as needed. Inform law enforcement, environmental agencies, and utilities.</li></ul><h4><strong>2) Incident Command and Zone Establishment</strong></h4><ul><li><strong>Command Structure:</strong> Establish Unified Command if multiple agencies are involved.</li><li><strong>Zones:</strong><ul><li><strong>Hot Zone:</strong> Area of immediate hazard; only accessible by technician-level responders.</li><li><strong>Warm Zone:</strong> Transition area for decontamination and staging.</li><li><strong>Cold Zone:</strong> Safe area for IC, staging, and support operations.</li></ul></li></ul><h4><strong>3) Isolation and Protective Actions</strong></h4><ul><li><strong>Isolation:</strong> Establish and enforce perimeter control around the incident.</li><li><strong>Evacuation or Shelter-in-Place:</strong> Determine the need based on the material, wind, and affected population. Communicate with the public.</li></ul><h4><strong>4) Defensive Actions</strong></h4><p>Operations-level personnel are limited to defensive strategies, including:</p><ul><li><strong>Containment:</strong> Diking or damming to prevent material spread. Diverting flow.</li><li><strong>Suppression:</strong> Apply water spray to reduce vapor release if safe. Avoid water on water-reactive materials.</li><li><strong>Monitoring:</strong> Use detection equipment.</li><li><strong>Fire Suppression:</strong> Suppress fires at a safe distance using proper extinguishing agents (consult ERG).</li></ul><h4><strong>5) Personal Protective Equipment (PPE)</strong></h4><ul><li><strong>Standard PPE:</strong> Structural firefighting gear is not chemical protective equipment and should only be used if necessary to protect life in emergency situations.</li><li><strong>Air Monitoring and Respiratory Protection:</strong> Use SCBA in atmospheres where airborne hazards are present.</li><li><strong>Limitations:</strong> Do not enter hot zones or perform tasks requiring chemical protective suits.</li></ul><h4><strong>6) Decontamination</strong></h4><ul><li><strong>Emergency Decontamination:</strong> Establish gross decontamination for exposed victims and responders.</li><li><strong>Responder Decontamination:</strong> Decontaminate personnel and equipment exiting the warm zone.</li></ul><h4><strong>7) Post-Incident Procedures</strong></h4><ul><li><strong>Documentation:</strong> Complete incident reports.</li><li><strong>Debriefing:</strong> Conduct a post-incident review.</li><li><strong>Restoration:</strong> Ensure all equipment is properly cleaned and inspected.</li></ul>",
"6.2":"<h2>Carbon Monoxide Incidents</h2><h3><strong>I. PURPOSE:</strong></h3><p>The purpose of this Standard Operating Guideline is to set forth certain practices for the response to incidents where Carbon Monoxide is, or is suspected of being present.</p><h3><strong>II. DISCUSSION:</strong></h3><p>CO is associated with about 500 unintentional non-fire-related deaths each year. About 60 percent of these deaths are from motor vehicle exhaust, and about 40 percent are associated with consumer products. CO in its pure form is colorless and odorless; however, other gasses that do have an odor often accompany it.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Characteristics of Carbon Monoxide (CO):</strong></h4><ol><li>Carbon Monoxide is an odorless, tasteless, colorless gas that can be deadly in relatively low concentrations. It is a by-product of incomplete combustion originating from fuels such as wood, oil, propane, coal, gas, kerosene, or charcoal.</li><li>Carbon monoxide has a specific gravity of .97, which causes the gas to be distributed evenly from floor to ceiling. CO has a lower explosive limit (LEL) of 12.5% and an upper explosive limit (UEL) of 74.2%. Ignition temperature is 1,128°F.</li><li>The greatest danger of CO is its attraction to the hemoglobin in the bloodstream. It bonds with hemoglobin, forming carboxy hemoglobin, which can cause symptoms from head pressure and nausea to convulsions and death.</li></ol><h4><strong>Detector Parameters and Alarm Settings:</strong></h4><p>UL standards require residential CO detectors to alarm prior to:</p><ol><li>400 PPM in 15 minutes</li><li>200 PPM in 35 minutes</li><li>100 PPM in 90 minutes</li></ol><h4><strong>Responding to Carbon Monoxide Alarms:</strong></h4><ul><li><strong>CO ALARM WITHOUT SYMPTOMS:</strong> Fire apparatus shall respond to all reported CO alarms. Evaluate and request additional equipment if needed.</li><li><strong>CO ALARM WITH SYMPTOMS:</strong> Fire apparatus and Ambulance shall respond immediately in emergency mode to CO alarms when occupants are experiencing symptoms of CO poisoning.</li></ul><h4><strong>Conducting an Assessment for Carbon Monoxide:</strong></h4><ol><li>Arrive and place equipment considering possible additional response.</li><li>Interview occupant to determine risk level. Treat any victims with symptoms and notify gas company if verified.</li><li>All personnel entering the structure shall be in full PPE with SCBA on but not breathing air.</li><li>Turn on monitor and \"zero\" it outside in fresh air.</li><li>Test “open-air” throughout the structure at eye level. If an immediate open-air reading of 35 PPM or greater is received:<ul><li>All personnel shall be in full PPE and breathing air.</li><li>All occupants shall be evacuated.</li><li>Ventilation shall be initiated until evacuated. Stop ventilation once evacuated to assist in finding the source, unless levels are above 100 PPM.</li></ul></li><li>Check appliances:<ul><li><strong>Gas Furnace/Water Heater:</strong> Check ambient air, visually inspect venting pipes/draft hoods, check combustion chamber for pure blue flame.</li><li><strong>Gas Clothes Dryer:</strong> Check ambient air, vent piping, check around door and access panel.</li><li><strong>Space Heaters/Gas Logs:</strong> Check area around pilot and combustion chamber.</li><li><strong>Fireplace:</strong> Check for damaged/clogged chimney and flue.</li><li><strong>Gas Range/Oven:</strong> Check access panels, pure blue pilot, inside oven, and around burners.</li><li><strong>Attached Garage:</strong> Check ambient air, around autos and fuel-powered equipment.</li></ul></li><li>If an appliance is found to be the source, shut off the appliance and fuel source, ventilate until safe. Notify the gas company. <strong>NO MEMBER SHALL ATTEMPT TO RE-LIGHT A PILOT OR RESTART/REPAIR ANY APPLIANCE/DEVICE.</strong></li><li>Once safe, structure may be re-entered. Advise occupant of actions taken.</li></ol><h4><strong>Instructions for the resident based on readings:</strong></h4><ul><li><strong>9 PPM or less:</strong> Our instruments did not detect elevated levels. Check your detector per manufacturer recommendations.</li><li><strong>10 PPM to 35 PPM:</strong> Potentially dangerous levels detected. We shut down the affected appliance. Do not use until repaired.</li><li><strong>36 PPM to 99 PPM:</strong> Exceeds maximum allowable concentration for continuous 8-hour exposure (OSHA). Immediate action required including evacuation, ventilation, and shutting down fuel sources.</li><li><strong>100 PPM or greater:</strong> Potentially lethal level detected. We shut off all fuel sources. Leave immediately and do not return until repairs are made and tested by the Gas Company.</li></ul>",
"6.3":"<h2>Marijuana Facilities</h2><h3><strong>I. PURPOSE</strong></h3><p>To outline safety procedures and responsibilities for fire department personnel when responding to incidents at marijuana grow and processing facilities, ensuring the protection of responders and the public from unique hazards associated with these occupancies.</p><h3><strong>II. DISCUSSION</strong></h3><p>Marijuana grow and processing facilities present unique hazards due to their specialized equipment, construction, and operational practices. These facilities often include:</p><ul><li>Highly flammable materials such as solvents used in extraction processes.</li><li>Compressed gas systems, such as carbon dioxide (CO2), for plant cultivation and extraction.</li><li>Electrical hazards, including low-hanging cables and high-energy systems.</li><li>Structural modifications that may create narrow corridors and confined spaces.</li><li>Potential exposure to hazardous chemicals or noxious fumes.</li></ul><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Assessment</strong></h4><ul><li><strong>Dispatch and Arrival:</strong> Gather info regarding facility type and known hazards. Approach deliberately and position apparatus at a safe distance.</li><li><strong>Size-Up:</strong> Identify low-hanging cables, CO2 systems, solvents. Assess ventilation systems. Evaluate structural stability.</li><li><strong>Notifications:</strong> Notify law enforcement, environmental agencies, and utility companies as needed. Request HazMat if necessary.</li></ul><h4><strong>2) Incident Command and Zone Establishment</strong></h4><ul><li><strong>Command Structure:</strong> Establish IC. Consider Unified Command with law enforcement for security.</li><li><strong>Zones:</strong> Establish hot, warm, and cold zones. Monitor for CO2 concentrations.</li></ul><h4><strong>3) Hazard Mitigation</strong></h4><ul><li><strong>Electrical Hazards:</strong> Identify and shut down power sources. Use extreme caution.</li><li><strong>CO2 and Compressed Gas Systems:</strong> Locate shutoff valves and depressurize if safe. Be aware of oxygen displacement. Use atmospheric monitoring.</li><li><strong>Flammable Materials:</strong> Isolate and secure areas containing solvents. Use non-sparking tools.</li><li><strong>Structural Hazards:</strong> Assess narrow corridors and confined spaces. Monitor air quality.</li></ul><h4><strong>4) Protective Actions</strong></h4><ul><li><strong>Evacuation:</strong> Evacuate occupants and secure perimeter. Work in teams.</li><li><strong>PPE and Monitoring:</strong> Use full structural firefighting PPE, including SCBA. Continuously monitor air quality for CO2, oxygen, and LEL.</li></ul><h4><strong>5) Firefighting Operations</strong></h4><ul><li><strong>Deliberate Offensive Interior Fire Attack:</strong> Should only be conducted with careful consideration of tight corridors, electrical systems, and compressed gas systems. Prioritize responder safety over property conservation.</li><li><strong>Initial Attack:</strong> Use defensive strategies when large amounts of flammable materials are present. Coordinate ventilation to avoid worsening fume concentrations.</li><li><strong>Fire Suppression:</strong> Use water or Class B foam for solvent fires. Avoid water in areas with electrical hazards until power is confirmed off.</li><li><strong>Team Operations:</strong> Always operate in teams. Assign a team to monitor CO2 levels.</li><li><strong>Salvage and Overhaul:</strong> Proceed with caution. Ensure atmospheric monitoring continues.</li></ul><h4><strong>6) Post-Incident Procedures</strong></h4><ul><li><strong>Decontamination:</strong> Decontaminate personnel and equipment.</li><li><strong>Investigation/Debriefing:</strong> Document hazards, actions, and equipment used. Notify the Chief and conduct a post-incident review.</li></ul>",
"6.4":"<h2>Natural / Propane Gas Incidents</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently and quickly control incidents involving the smell of gas or a natural gas leak.</p><h3><strong>II. DISCUSSION:</strong></h3><p>This guideline will establish a standard approach and response to the report of a smell of gas or a confirmed natural gas leak. The PFD responds to all reported smells of gas as if it were a confirmed leak until it is determined otherwise. The PFD responds in a supporting role to Oklahoma Natural Gas (ONG) or other supplier (e.g., Propane suppliers).</p><h3><strong>III. GUIDELINE:</strong></h3><p>The appropriate apparatus shall respond quickly with due regard for safety (Refer to SOG 1.4). Implement Incident Command. Minimum PPE for all firefighters in the hazard zone shall be full turnout gear and SCBA. Verify ONG has been notified.</p><p>Apparatus should approach the location with care and park away from the area in a safe zone (uphill & upwind) if the leak is outside. Evacuate endangered persons. Use a multi-gas meter. Secure the affected area and deny entry to anyone except emergency responders and gas company reps. Consider all avenues of access and secure them all.</p><h4><strong>For reported leaks in a structure:</strong></h4><p>The IC should determine if it is safe for firefighters to investigate. If so, investigate using a multi-gas meter to locate the source. If not, standby for the gas company in a safe area. If a leak is located and a local gas valve is available, shut off the gas supply. If no local valve, the service valve at the gas meter should be located and shut off if safe. Initiate ventilation if necessary.</p><h4><strong>For reported leaks in outside areas:</strong></h4><p>Fire department should maintain the exclusion zone until notified by gas company representatives the scene is safe. PFD will not attempt to stop leaks in broken gas mains.</p><p>PFD will not operate valves in natural gas distribution systems. If operating equipment caused the leak and a motor is still running, turn off the motor if safe. Once safe, determine if fire department resources are still needed.</p><h4><strong>Strategic Considerations</strong></h4><ol><li>Exclusion zones should be as large as necessary. Err on the side of caution.</li><li>Allow burning gas to continue to burn. It is safer than putting the fire out if the source has not been shut off.</li></ol><h4><strong>Tactical Considerations</strong></h4><ol><li>Do not operate any electric switches or radios inside the hazardous atmosphere.</li><li>Natural gas is lighter than air.</li><li>Propane is heavier than air.</li></ol>",
"6.5":"<h2>Carbon Dioxide Alarms and Incidents</h2><h3><strong>I. PURPOSE</strong></h3><p>To provide guidelines for responding to carbon dioxide (CO2) alarms and incidents in occupancies utilizing CO2 systems, such as marijuana grow and processing facilities, soft drink dispensing systems, and other commercial or industrial applications.</p><h3><strong>II. DISCUSSION</strong></h3><p>CO2 is colorless, odorless, and heavier than air, making it capable of displacing oxygen and creating life-threatening environments. Responders must be aware of the following:</p><ul><li>CO2 displaces oxygen, posing an asphyxiation hazard.</li><li>Leaks can occur in piping, cylinders, or storage tanks.</li><li>CO2 concentrations above 5% can cause serious health effects; concentrations above 10% can be fatal.</li><li>Facilities may have low-hanging cables, confined spaces, or narrow corridors.</li></ul><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Assessment</strong></h4><ul><li><strong>Dispatch/Arrival:</strong> Gather information. Position apparatus upwind and uphill. Establish a secure perimeter.</li><li><strong>Size-Up:</strong> Identify CO2 system components. Assess for signs of release (frost, hissing, dizziness in occupants).</li></ul><h4><strong>2) Notifications</strong></h4><ul><li>Notify facility manager. Request HazMat if needed.</li></ul><h4><strong>3) Incident Command and Zone Establishment</strong></h4><ul><li>Establish IC. Establish hot, warm, and cold zones. Maintain strict control over personnel entering the hot zone.</li></ul><h4><strong>4) Mitigation and Hazard Control</strong></h4><ul><li><strong>Atmospheric Monitoring:</strong> Utilize multi-gas detectors to monitor CO2 and oxygen.</li><li><strong>Shutoff and Ventilation:</strong> Locate and activate emergency shutoff valves. Use natural or mechanical ventilation.</li><li><strong>Rescue Operations:</strong> Perform rescues only with personnel in full PPE, including SCBA. Ensure backup teams are on standby.</li></ul><h4><strong>5) Occupancy-Specific Considerations</strong></h4><ul><li><strong>Marijuana Grow Facilities:</strong> Be cautious of narrow corridors and low-hanging cables.</li><li><strong>Soft Drink Systems:</strong> Check for leaks in pressurized tanks/hoses. Inspect for accumulation in low-lying areas.</li></ul><h4><strong>6) Protective Actions</strong></h4><ul><li><strong>PPE Requirements:</strong> Full structural firefighting PPE and SCBA for hot zone entry.</li><li><strong>Evacuation:</strong> Evacuate all occupants.</li></ul><h4><strong>7) Post-Incident Procedures</strong></h4><ul><li>Decontaminate personnel/equipment. Complete incident report. Notify the Chief.</li></ul>",
"6.6":"<h2>Power Lines and Energized Equipment</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for responding safely and effectively to incidents involving downed power lines, energized electrical equipment, and other electrical hazards.</p><h3><strong>II. DISCUSSION</strong></h3><p>Incidents involving energized power lines and electrical equipment pose significant risks, including electrocution, fire, and explosions. Responders must:</p><ul><li>Assume all power lines are energized until verified otherwise by the utility company.</li><li>Be aware of step potential and touch potential.</li><li>Maintain safe distances and use appropriate PPE.</li></ul><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Assessment</strong></h4><ul><li><strong>Arrival:</strong> Position apparatus at least <strong>50 feet</strong> from downed power lines and energized equipment. Maintain access routes for utility personnel.</li><li><strong>Scene Size-Up:</strong> Identify hazards, secure the area, and keep bystanders at a safe distance.</li></ul><h4><strong>2) Notifications</strong></h4><ul><li>Notify the utility company immediately to de-energize the affected lines.</li></ul><h4><strong>3) Incident Command and Safety Zones</strong></h4><ul><li><strong>Safety Zones:</strong><ul><li><strong>Hot Zone:</strong> Area within 30 feet of downed power lines or energized equipment.</li><li><strong>Warm Zone:</strong> Buffer area for personnel support.</li><li><strong>Cold Zone:</strong> Staging area for apparatus and non-essential personnel.</li></ul></li></ul><h4><strong>4) Hazard Mitigation and Safety Measures</strong></h4><ul><li><strong>Downed Power Lines:</strong> Assume energized. Maintain minimum safe distance of 30 feet. Use insulated tools.</li><li><strong>Step and Touch Potential:</strong> Warn personnel to shuffle feet or hop while moving away. Avoid touching conductive objects.</li><li><strong>Vehicle Incidents:</strong> If a vehicle is energized, instruct occupants to stay inside until power is confirmed off. If evacuation is necessary due to fire, instruct occupants to jump clear of the vehicle without touching it and shuffle away.</li><li><strong>Energized Equipment Fires:</strong> Use a <strong>CO2 or dry chemical extinguisher</strong> for small fires. Do not use water streams unless power has been de-energized.</li></ul><h4><strong>5) Protective Actions</strong></h4><ul><li><strong>PPE Requirements:</strong> Responders must wear full structural firefighting PPE and ensure gloves are dry and non-conductive. Use arc-rated face shields if working near equipment.</li><li><strong>Scene Security:</strong> Establish barricades.</li></ul><h4><strong>6) Post-Incident Procedures</strong></h4><ul><li><strong>Utility Confirmation:</strong> Ensure utility personnel confirm power is de-energized before overhaul.</li><li><strong>Documentation:</strong> Complete incident report.</li></ul>",
"6.7":"<h2>Atmospheric Monitoring and Gas Detection</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines and responsibilities for the operation and maintenance of the BW Gas Alert Micro Clip X3 multi gas detector.</p><h3><strong>II. DISCUSSION:</strong></h3><p>The BW Gas Alert Micro Clip X3 is designed to assess potential worker exposure to combustible and toxic gasses and vapors as well as low level of oxygen. The monitor detects:</p><ul><li>Combustible gasses (LEL)</li><li>Oxygen-deficient or oxygen-rich atmospheres (O2)</li><li>Carbon Monoxide (CO)</li><li>Hydrogen Sulfide (H2S)</li></ul><p>While the instrument can detect up to 23% oxygen in ambient air, it is approved for use only up to 19.5%.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Definitions:</strong></h4><ul><li><strong>LEL:</strong> Lower Explosive Limit.</li><li><strong>STEL:</strong> Short Term Exposure Limits (15 Minutes).</li><li><strong>TWA:</strong> Time Weighted Average (8-hour workday).</li><li><strong>CO:</strong> Carbon Monoxide (1200 PPM IDLH).</li><li><strong>H2S:</strong> Hydrogen Sulfide (100 PPM IDLH).</li></ul><h4><strong>Testing Requirements:</strong></h4><ul><li><strong>Operational Test:</strong> To be completed daily or before each use.</li><li><strong>Calibration:</strong> Calibration should be completed upon notification.</li></ul><h4><strong>Alarm Limits:</strong></h4><ul><li><strong>LEL:</strong> Low alarm 10%, High alarm 20%</li><li><strong>O2:</strong> Low alarm 19.5%, High alarm 23.0%</li><li><strong>CO:</strong> Low alarm 25 PPM, High alarm 100 PPM, STEL 100 PPM, TWA 25 PPM</li><li><strong>H2S:</strong> Low alarm 10 PPM, High alarm 15 PPM, STEL 15 PPM, TWA 10 PPM</li></ul><h4><strong>Confined Space Entry (NON-Rescue):</strong></h4><p>This guideline is to be utilized for firefighter entry or city employee entry into a confined space. Monitoring should be continuous.</p><ol><li>Sample the atmosphere at three levels: top (2’ below the opening), middle, and bottom (1’ from the bottom). Each area shall be monitored for at least 30 seconds before moving to the next level.</li><li>Once all levels are tested and cleared, maintain monitoring 1’ from the bottom for the duration of operations.</li></ol>",
"7.1":"<h2>Elevator Emergencies</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the safe and effective response to elevator emergencies, ensuring the safety of occupants and responders while minimizing potential damage to equipment.</p><h3><strong>II. DISCUSSION</strong></h3><p>Elevator emergencies often involve passengers trapped due to mechanical malfunctions or power outages. Responders must ensure occupant safety and coordinate with building management and elevator technicians. Hydraulic elevators are common, and responders must be prepared to manually lower the elevator car if necessary.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Assessment</strong></h4><ul><li><strong>Dispatch/Arrival:</strong> Gather details. Locate the elevator machine room (typically near the lowest level of service or within 100 feet of the shaft).</li><li><strong>Scene Size-Up:</strong> Assess hazards. Establish contact with building management.</li></ul><h4><strong>2) Notifications</strong></h4><ul><li>Notify building management. Request EMS if occupants are in distress.</li></ul><h4><strong>3) Safety Measures</strong></h4><ul><li><strong>PPE Requirements:</strong> Wear appropriate PPE, including gloves and helmets.</li><li><strong>Power Control:</strong> Disconnect the main power supply to the elevator at the machine room. Implement lock-out/tag-out procedures to prevent accidental re-energizing.</li><li><strong>Communication:</strong> Reassure occupants and advise them to avoid attempting self-rescue.</li></ul><h4><strong>4) Manual Lowering of Hydraulic Elevators</strong></h4><p>If technicians are unavailable and manual lowering is necessary:</p><ul><li><strong>Locate the Machine Room:</strong> Access the machine room to locate the hydraulic pump unit and manual lowering valve.</li><li><strong>Ensure Power is Disconnected:</strong> Confirm the main power supply is off and secured.</li><li><strong>Operate the Manual Lowering Valve:</strong> Slowly open the valve to release hydraulic fluid, allowing the car to descend to the nearest landing. Monitor the descent. Close the valve once the car reaches the desired landing.</li><li><strong>Verify Car Position and Open Doors:</strong> Ensure the car is level before opening hoistway and car doors.</li></ul><h4><strong>5) Procedures for Non-Hydraulic Elevators</strong></h4><p>If the elevator is between floors and cannot be lowered manually:</p><ul><li><strong>Access the Car:</strong> Utilize the emergency access key provided by building management to open the hoist way doors closest to the car.</li><li><strong>Stabilize the Elevator:</strong> Use wedges or chocks to stabilize the car and prevent any movement during occupant egress.</li><li><strong>Coordinate with Technical Assistance:</strong> If the car cannot be stabilized, wait for an elevator technician.</li></ul><h4><strong>6) Post-Rescue Procedures</strong></h4><ul><li><strong>Secure the Elevator:</strong> Leave the elevator out of service until inspected by a qualified technician.</li><li><strong>Documentation:</strong> Document actions taken.</li></ul>",
"7.2":"<h2>Aircraft Incidents</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the safe and effective response to incidents occurring, including emergencies involving small jet engines, propeller-driven aircraft, and helicopters.</p><h3><strong>II. DISCUSSION</strong></h3><p>Aircraft incidents present unique hazards due to fuels, propellers, hazardous materials, and confined areas. Coordination with airport personnel is critical.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Size-Up</strong></h4><ul><li><strong>Arrival:</strong> Stage apparatus in a safe area. Position upwind and uphill. Avoid active runways unless directed.</li><li><strong>Scene Size-Up:</strong> Assess hazards including fuel spills, rotating propellers, hazardous materials, and structural collapse potential. Establish a hot zone.</li></ul><h4><strong>2) Safety Measures</strong></h4><ul><li>Wear full PPE, including SCBA.</li><li>Ensure apparatus is grounded when operating near aircraft to prevent static discharge.</li><li>Maintain a minimum distance of 100 feet from rotating propellers or helicopter rotors.</li><li>Avoid using radios or electronic devices near spilled fuel due to ignition risk.</li></ul><h4><strong>3) Fire Suppression</strong></h4><ul><li><strong>Fuel Spills:</strong> Use foam suppression systems (Class B foam recommended). Avoid directing high-pressure streams into fuel spills.</li><li><strong>Aircraft Fires:</strong> Approach from upwind using foam or dry chemical extinguishers. Cool adjacent parts. Ventilate cautiously.</li></ul><h4><strong>5) Rescue Operations</strong></h4><ul><li>Prioritize life safety. Use aircraft-specific tools. Be cautious of structural weaknesses. Establish triage areas.</li></ul><h4><strong>6) Hazard Mitigation</strong></h4><ul><li>Control fuel spills. Monitor for hazardous materials (lithium-ion batteries). Isolate emergency exits and fuel shut-off valves.</li></ul><h4><strong>7) Helicopter Incidents</strong></h4><ul><li>Approach helicopters only after ensuring rotor blades have fully stopped.</li><li>Avoid the tail rotor area at all times.</li><li>Extinguish fires cautiously.</li></ul>",
"7.3":"<h2>MRI Rooms</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the safe and effective response to emergencies in MRI (Magnetic Resonance Imaging) rooms.</p><h3><strong>II. DISCUSSION</strong></h3><p>MRI rooms present unique hazards due to the strong magnetic fields generated by the machine. <strong>These fields are active even when the machine is not in operation</strong> and can attract ferromagnetic objects with significant force, posing serious projectile risks. Additional hazards include cryogenic gases (liquid helium), confined spaces, and electrical equipment.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Initial Response and Scene Size-Up</strong></h4><ul><li><strong>Arrival:</strong> Stage apparatus at a safe distance. Establish contact with facility personnel or MRI technicians immediately.</li><li><strong>Size-Up:</strong> Assess hazards (magnetic field status, ferromagnetic objects, cryogenic gas leaks, trapped patients).</li></ul><h4><strong>2) Notifications</strong></h4><ul><li>Notify facility management. Request an MRI technician. Alert HazMat if cryogenic gases are involved.</li></ul><h4><strong>3) Safety Measures</strong></h4><ul><li><strong>Magnetic Field Awareness:</strong> Assume the magnetic field is active. Do not bring ferromagnetic objects (e.g., tools, SCBA tanks, stretchers) into the MRI room. Use MRI-safe equipment.</li><li><strong>Cryogenic Gas Precautions:</strong> Be aware of liquid helium leaks (oxygen displacement and frostbite). Ventilate the area.</li><li><strong>Electrical Safety:</strong> Disconnect power only under the guidance of a qualified technician.</li></ul><h4><strong>4) Patient Rescue</strong></h4><ul><li>Coordinate with facility staff. If the field is active, utilize non-magnetic stretchers. Avoid metallic medical devices. If entrapped, request immediate assistance from MRI technicians.</li></ul><h4><strong>5) Fire Suppression</strong></h4><ul><li><strong>Small Fires:</strong> Use non-ferromagnetic fire extinguishers (e.g., carbon dioxide or dry chemical). Avoid water-based suppression unless confirmed safe.</li><li><strong>Large Fires:</strong> Evacuate and establish defensive operations. Consider quenching the MRI magnet (releasing cryogenic gases to shut down the field) <em>only</em> under the guidance of facility personnel.</li></ul><h4><strong>6) Hazard Mitigation</strong></h4><ul><li>Secure all loose ferromagnetic objects. Prohibit unauthorized entry. Dissipate cryogenic gas leaks through ventilation.</li></ul>",
"7.4":"<h2>Storm Siren Activation and Testing</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines for the activation and testing of the outdoor warning sirens regarding severe weather incidents.</p><h3><strong>II. DISCUSSION:</strong></h3><p>This guideline ensures the timely activation and proper function of the City of Piedmont outdoor warning sirens. Sirens are set to sound for 3 minutes following activation and there is not an “all clear signal”.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Testing:</strong></h4><p>Testing shall be conducted on Saturdays at 12:00 noon unless there is a threat of inclement weather in the Piedmont area (including ice build-up with below freezing temperatures).</p><ul><li>Saturday morning briefing shall include a weather check.</li><li>Calls shall be made to locate observers or rig assignments given. Sirens that failed previously get priority observation.</li><li>At 12:00 Hrs the OWS shall be activated.</li><li>After testing, the Chief shall be notified of all failures.</li></ul><h4><strong>Severe weather activation:</strong></h4><p>Sirens shall be activated for any of the following situations:</p><ul><li>Once the City of Piedmont has been placed in a Tornado Warning (verified by Shift Commander/Chief).</li><li>Upon the request of a member of the Piedmont Fire Department storm watch team if a significant threat is observed tracking toward Piedmont.</li><li>Calls for activation from outside PFD must be approved by the Chief or senior storm team member.</li></ul><h4><strong>Points of Activation:</strong></h4><p>The sirens can be activated from 3 locations:</p><ol><li>The computer in the Chiefs office.</li><li>The Chiefs cell phone.</li><li>The Shift Commander’s Cell Phones.</li></ol><h4><strong>Annual Public Information:</strong></h4><p>The public shall be informed annually of the following:</p><ul><li>What activations mean: Piedmont is in a tornado warning or a PFD spotter determined a direct threat. Activation lasts 3 minutes. <strong>There is no all-clear signal</strong> (if they sound again, a threat remains).</li><li>The need for at least 3 sources of weather information.</li><li>The safest place to shelter (FEMA shelter, basement, or inner-most room on the lowest level). Vehicles and mobile homes are unsafe.</li></ul>",
"7.5":"<h2>Drone Operation</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the safe and effective deployment and operation of drones (Unmanned Aircraft Systems, UAS) in accordance with the FAA Certificate of Authorization (COA).</p><h3><strong>II. DISCUSSION</strong></h3><p>All UAS operations must strictly adhere to the department’s COA requirements and FAA regulations.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Deployment Authorization</strong></h4><ul><li>UAS deployment must be approved by the Incident Commander (IC) or designated officer.</li></ul><h4><strong>2) Operator Requirements</strong></h4><ul><li>Only FAA-certified remote pilots with current training on the department’s UAS equipment are authorized.</li></ul><h4><strong>3) Pre-Flight Procedures</strong></h4><ul><li>Conduct pre-flight inspection. Review mission. Check weather. Confirm operation is within COA-permitted airspace.</li></ul><h4><strong>4) Flight Operations</strong></h4><ul><li>Maintain a visual line of sight (VLOS) with the UAS at all times unless operating under COA provisions.</li><li>Ensure a maximum altitude of <strong>400 feet AGL</strong> (or as specified in the COA).</li><li>Avoid flying over people unless authorized.</li></ul><h4><strong>5) Operational Use Cases</strong></h4><ul><li><strong>Firefighting:</strong> Aerial views for decision-making.</li><li><strong>Search and Rescue:</strong> Thermal imaging for victims.</li><li><strong>Hazardous Materials:</strong> Identify spills without exposing personnel.</li><li><strong>Post-Incident:</strong> Document scene conditions.</li></ul><h4><strong>6) Emergency Procedures</strong></h4><ul><li>Land immediately in case of: Loss of communication, malfunction, or presence of manned aircraft.</li></ul><h4><strong>7) Post-Flight Procedures</strong></h4><ul><li>Conduct post-flight inspection. Retrieve data securely. Complete post-flight log.</li></ul>",
"7.6":"<h2>Cold Weather Operations</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines and responsibilities for operating pumps and aerial apparatus in freezing weather conditions.</p><h3><strong>II. DISCUSSION:</strong></h3><p>Firefighters and their equipment must be prepared for cold weather challenges. Everything moves slower in extreme cold. Apparatus must slow down; operations take longer.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>1. Engines and Tankers:</strong></h4><ul><li><strong>Temperatures (>32°F):</strong> Normal operations.</li><li><strong>Temperatures (32°F and Below):</strong> Air Tanks will be evaluated and drained of condensation. When in use, water must be circulated. Back at the station, open/close all drains and caps to remove excess water.</li></ul><h4><strong>2. Brush Pumpers:</strong></h4><ul><li><strong>Temperatures (>32°F):</strong> Normal operations.</li><li><strong>Temperatures (32°F and Below):</strong> Route booster line into the tank with valves open. Pumps shall be started and left at idle to circulate water prior to departing the station.</li></ul><h4><strong>3. Aerial Apparatus:</strong></h4><ul><li><strong>Temperatures (>32°F):</strong> Normal operations.</li><li><strong>Temperatures (32°F and Below):</strong> Drain all waterways per manufacturer recommendations.</li></ul><h4><strong>Cautions and Warnings:</strong></h4><ul><li>Operation in extreme cold weather may overload and/or damage the aerial.</li><li>Do not use multiple functions until the temperature is above minimum start-up temperature.</li><li>Ice build-up on the aerial waterway can cause damage during extension and retraction.</li><li><strong>Ice can form inside and between the waterway tubes.</strong> During freezing conditions, it is best to maintain water flow while extending or retracting the aerial.</li><li><strong>After flowing water when temperatures are below freezing, immediately elevate and drain the aerial waterway.</strong> If ice exists between the waterway tubes, extending or retracting the aerial will break the waterway.</li></ul><h4><strong>General Cold Weather Operating Guidelines:</strong></h4><ul><li>Continued use of aerial functions circulates oil, delaying cooling.</li><li>Slow operation after non-use is less harmful.</li><li>Continually monitor hydraulic oil pressure.</li><li>Pay attention to electric cables and hoses tracking.</li></ul><h4><strong>Load Limitations with Aerial Icing:</strong></h4><ul><li>Operating an aerial device with ice build-up is very dangerous. Capacities shown on the Ice Condition load chart are based on a uniform coating. Large build-ups near the tip can rapidly lead to instability. Do not exceed load limits.</li></ul>",
"7.7":"<h2>Landing Zone Operations</h2><h3><strong>Purpose</strong></h3><p>To define consistent guidelines and responsibilities for selecting, establishing and maintaining a safe landing zone for an air ambulance.</p><ul><li>Identify a clear, flat area free of obstacles such as trees, power lines, and buildings.</li><li>Mark the landing zone with visible markers, such as strobes, to guide the pilot.</li><li>Ensure the area is large enough, <strong>ideally 100 feet by 100 feet</strong>, to accommodate the helicopter.</li><li>Secure the landing zone by removing any loose debris or potential hazards.</li><li>Establish communication with the air ambulance crew to coordinate arrival and landing.</li><li>Designate a ground crew to assist with patient transfer and ensure safety during operations.</li></ul>",
"8.1":"<h2>Inspection and Plan Review</h2><h3><strong>I. PURPOSE:</strong></h3><p>To ensure the safety and well-being of the community by establishing a systematic approach to life safety inspections to identify and mitigate hazards.</p><h3><strong>II. DISCUSSION:</strong></h3><p>Life safety inspections are a critical component of PFD's mission. The Fire Prevention Officer, acting under the Authority Having Jurisdiction (AHJ) of the Fire Chief, is responsible for scheduling, conducting, and overseeing these inspections.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Inspection Schedule</strong></h4><p>Life safety inspections will be performed on the following rotation:</p><ol><li><strong>Annually, Listed in order of Priority:</strong><ul><li>Childcare facilities</li><li>Schools</li><li>Assisted living and nursing homes</li><li>Hospitals</li><li>Hotels</li></ul></li><li><strong>Every Other Year:</strong><ul><li>Moderate-Risk Occupancies:<ul><li>Churches</li><li>Restaurants</li><li>Businesses with fire suppression systems</li><li>High-hazard occupancies</li></ul></li></ul></li><li><strong>Every Four Years:</strong><ul><li>Low-Risk Occupancies:<ul><li>All other businesses</li></ul></li></ul></li></ol><h4><strong>Plan Reviews</strong></h4><p><strong>Outside Reviewers shall handle the following:</strong></p><ul><li>Buildings with multiple fire protection systems</li><li>High-hazard occupancies</li><li>Assembly occupancies</li><li>Occupancies included in the annual inspection schedule (childcare, schools, nursing homes, hospitals, hotels)</li></ul><p><strong>Internal Reviews may complete the following:</strong></p><ul><li>All other plan reviews may be conducted by the Piedmont Fire Department.</li></ul><h4><strong>Responsibilities</strong></h4><ul><li><strong>Fire Prevention Officer:</strong> Schedule and oversee inspections. Coordinate plan reviews. Act under the AHJ of the Fire Chief.</li><li><strong>Fire Chief:</strong> Provide oversight and final authority.</li></ul>",
"8.2":"<h2>Preplans</h2><h3><strong>I. PURPOSE:</strong></h3><p>To enhance firefighter safety and operational efficiency by creating and maintaining detailed pre-incident plans (preplans) for buildings within Piedmont.</p><h3><strong>II. DISCUSSION:</strong></h3><p>Building preplans provide critical information about building layouts, fire protection systems, hazardous materials, and other features. The Fire Prevention Officer oversees the development, review, and distribution of building preplans.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Preplan Priorities</strong></h4><ol><li><strong>High-Priority Occupancies:</strong> Child care facilities, Schools, Assisted living/nursing homes, Hospitals, High-hazard occupancies.</li><li><strong>Moderate-Priority Occupancies:</strong> Assembly occupancies, Restaurants, Hotels, Large industrial/commercial buildings.</li><li><strong>Low-Priority Occupancies:</strong> General business occupancies, Low-hazard storage facilities.</li></ol><h4><strong>Preplan Components</strong></h4><ul><li><strong>Building Layout:</strong> Floor plans with exits, stairs, fire walls. Fire protection systems.</li><li><strong>Hazard Identification:</strong> Hazardous materials storage. Utility shutoffs.</li><li><strong>Occupancy Information:</strong> Maximum limits. Vulnerable populations.</li><li><strong>Operational Considerations:</strong> Access points. Staging areas. Special operational challenges.</li></ul><h4><strong>Development and Maintenance</strong></h4><ul><li><strong>Initial Development:</strong> Preplans for new high-priority occupancies must be completed within 90 days of occupancy.</li><li><strong>Annual Review:</strong> All pre-plans will be reviewed, confirmed and updated annually.</li><li><strong>Revisions:</strong> Updates made following renovations, changes in use, or code updates.</li></ul>",
"8.3":"<h2>Department Provided Smoke Detectors</h2><h3><strong>I. PURPOSE:</strong></h3><p>To promote fire safety and reduce the risk of injury or death by providing and installing smoke detectors for residents in need. Installations must adhere to NFPA standards.</p><h3><strong>II. DISCUSSION:</strong></h3><p>To mitigate liability and ensure program efficiency, all installations are conducted by trained department members. A liability waiver and installation checklist must be completed before any smoke detector is installed.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Eligibility and Request Process</strong></h4><ul><li>Priority given to: Low-income households, homes with elderly/young children, residences without functioning detectors.</li></ul><h4><strong>Installation Requirements</strong></h4><ol><li><strong>NFPA Compliance:</strong> Detectors placed inside each sleeping area, outside each sleeping area in the immediate vicinity, and on each level including basements.</li><li><strong>Installation by Department Members:</strong> Only PFD personnel are authorized to install provided detectors. Must test after installation.</li><li><strong>Documentation:</strong> A <strong>liability waiver</strong> must be signed prior to installation. An <strong>installation checklist</strong> must be completed.</li></ol><h4><strong>Follow-Up and Maintenance</strong></h4><ul><li>Residents advised to test monthly. If PFD replaces batteries, verify compliance.</li></ul><h4><strong>Proactive Inspections:</strong></h4><ul><li>During routine calls, crews should proactively look for smoke detector coverage and recommend the program if needed.</li></ul>",
"9.1":"<h2>Hose Testing</h2><h3><strong>I. PURPOSE:</strong></h3><p>This guideline describes the hose testing process used by the Piedmont Fire Department (PFD).</p><h3><strong>II. DISCUSSION:</strong></h3><p>All in-service fire hose shall be service tested once a year. Repaired hose and new hose will also be tested prior to being placed in service.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Testing Area/General</strong></h4><ol><li>Do not test hose on any operating roadway.</li><li>Choose a clean, paved location with minimal traffic.</li><li>Use traffic cones. Personnel must wear appropriate PPE.</li></ol><h4><strong>Service Testing Procedure</strong></h4><ol><li>Visually inspect hose. Remove defective sections.</li><li>Determine test pressure:<ul><li>Attack hose: <strong>300 psi</strong></li><li>Supply hose: <strong>200 psi</strong></li></ul></li><li>Connect hoses in sections no longer than 150 feet in a straight line.</li><li>Attach a nozzle and mark behind each coupling with a permanent marker to check for slippage.</li><li>Open test gate valve, raise end to evacuate air, close nozzle.</li><li>Raise pressure slowly to the required psi and hold for <strong>5 minutes</strong>.</li><li>The hose should be inspected by walking down the <strong>left side</strong> of the hose (away from the pump towards the nozzle) approximately 15 feet away while under pressure. <em>(The hose will roll to the right should a rupture occur).</em> Never straddle the hose.</li><li>Open nozzle and drain.</li><li>Inspect couplings for slippage. If slippage of <strong>more than 1/2 inch</strong> is found, take out of service.</li></ol>",
"9.2":"<h2>Hydrant Flow Testing and Annual Maintenance</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish a consistent procedure for hydrant maintenance and flow testing.</p><h3><strong>II. DISCUSSION</strong></h3><p>Proper maintenance and flow testing ensure hydrants are in proper working condition.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>1) Hydrant Maintenance</strong></h4><ul><li><strong>Inspection Schedule:</strong> All hydrants shall be inspected at least annually.</li><li><strong>Inspection Procedure:</strong><ul><li>Visual check for damage.</li><li>Mechanical check (open/close smoothly).</li><li>Drainage test (ensure it drains to prevent freezing).</li><li>Paint/touch up.</li></ul></li></ul><h4><strong>2) Hydrant Flow Testing</strong></h4><ul><li><strong>Testing Schedule:</strong> Conduct flow testing on all hydrants at least once every five years.</li><li><strong>Procedure:</strong><ul><li>Static Pressure Test (attach gauge, close other outlets).</li><li>Flow Test (open hydrant, record flow rate and residual pressure with pitot gauge).</li><li>Residual Pressure Test.</li></ul></li></ul>",
"9.3":"<h2>SOP 9.3</h2><p><em>(This section is intentionally blank in the manual.)</em></p>",
"9.4":"<h2>Equipment Maintenance, Records, and Inventory</h2><h3><strong>I. PURPOSE:</strong></h3><p>To maintain PFD vehicles, equipment, and facilities in a state of readiness and maintain reliable records.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>Maintenance Procedures:</strong></h4><ul><li><strong>Daily Checks:</strong> Documented on the daily check sheet. Deficiencies noted via email to the Fire Chief and Fleet Manager.</li><li><strong>Weekly Checks:</strong> Ensure manufacturer, DOT, and NFPA standards are met.</li><li><strong>Monthly Equipment Checks:</strong> Inventories and equipment checks.</li><li><strong>Preventive Maintenance:</strong> Logged in the PFD/EMS reporting system.</li></ul><h4><strong>Apparatus and Equipment Maintenance:</strong></h4><ul><li>Serious safety problems shall result in removal of the apparatus from service. The decision is vested with the department officer in coordination with the Fire Chief. Out-of-service vehicles must be <strong>clearly identified</strong>.</li></ul><h4><strong>Breathing Apparatus – SCBA:</strong></h4><ul><li>SCBA shall be checked during weekly checks and after every use. Advanced repairs must be performed by a qualified vendor.</li></ul><h4><strong>Pumps:</strong></h4><ul><li>All apparatus pumps shall be tested on a <strong>weekly basis</strong>. Annual tests by qualified technicians.</li></ul><h4><strong>Property Records and Federal Grants:</strong></h4><ul><li>Federally funded equipment must maintain specific records (Description, Acquisition date, Cost, Percentage of Federal participation, etc.).</li><li>Physical inventory of grant-funded equipment must be conducted at least once every two years.</li></ul>",
"9.5":"<h2>Records Retention for Federal Grants</h2><h3><strong>Records Retention Memorandum for Federal Grant Awards</strong></h3><p>In accordance with the 2 CFR 200.318 – 200.327 Retention requirements for records.</p><p>The Piedmont Fire Department will retain all records (financial, supporting documents, statistical) pertinent to a Federal award for a period of <strong>three years</strong> from the date of submission of the final expenditure report.</p><p>Exceptions extending the 3-year period:</p><ul><li>If any litigation, claim, or audit is started before the expiration of the 3-year period, the records must be retained until all findings have been resolved.</li><li>When notified in writing to extend the retention period.</li><li>Records for real property and equipment acquired with Federal funds must be retained for 3 years <strong>after final disposition</strong>.</li></ul>",
"10.1":"<h2>Staging Operations</h2><h4><strong>Level One Staging</strong></h4><ul><li>If your apparatus has not received an assignment when it arrives on scene, you will notify the incident commander that your apparatus is at Level One Staging.</li><li>Level One Staging involves positioning units near the incident, generally at the closest available fire hydrant, or less than one minute away from the operations scene.</li><li>Apparatus at Level One Staging must be prepared to receive an assignment by the incident commander.</li></ul><h4><strong>Level Two Staging</strong></h4><ul><li>Level 2 staging is a tactical response strategy for larger incidents.</li><li>It involves positioning additional units at a designated staging area away from the scene.</li><li>This allows for rapid deployment of resources as needed without congestion at the incident site.</li><li>Staging areas are typically established based on the incident's size and complexity.</li></ul>"

    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      return response.json();
    })
    .then(data => {
      QUESTIONS = data.filter(q => q.type === "mc"); // Force strictly MC questions
      buildCategoryList();
      buildSopSidebar();
      updateStartBtn();
    })
    .catch(error => {
      console.error('Error loading questions:', error);
      document.getElementById('category-list').innerHTML = `<p style="color:red; font-weight:bold;">Error loading questions.json. Ensure the file is in the same directory and you are running a local server if testing locally.</p>`;
    });
};

/* ══════════════════════════════════════════════════════════
   FISHER-YATES SHUFFLE ALGORITHM
═══════════════════════════════════════════════════════════ */
function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() { switchScreen('screen-home'); }

function confirmEnd() {
  document.getElementById('confirm-title').innerText = "End Quiz?";
  document.getElementById('confirm-msg').innerText = "Are you sure you want to end your current session?";
  document.getElementById('confirm-backdrop').classList.add('open');
}
function confirmResolve(yes) {
  document.getElementById('confirm-backdrop').classList.remove('open');
  if (yes) goHome();
}

/* ══════════════════════════════════════════════════════════
   HOME SCREEN SETUP
═══════════════════════════════════════════════════════════ */
function buildCategoryList() {
  const container = document.getElementById('category-list');
  container.innerHTML = '';
  
  sectionsList.forEach(sec => {
    const qCount = QUESTIONS.filter(q => q.section === sec).length;
    if (qCount === 0) return;
    
    const row = document.createElement('div');
    row.className = 'category-row';
    row.innerHTML = `
      <div class="cat-info">
        <div class="cat-name">${sec}</div>
        <div class="cat-count">${qCount} questions</div>
      </div>
      <label class="toggle">
        <input type="checkbox" class="cat-cb" value="${sec}" checked onchange="updateStartBtn()">
        <span class="toggle-slider"></span>
      </label>
    `;
    container.appendChild(row);
  });
}

function setAllTopics(state) {
  document.querySelectorAll('.cat-cb').forEach(cb => cb.checked = state);
  updateStartBtn();
}

// Preset Count selection
function setCount(val, btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  if (btn) btn.classList.add('selected');
  selectedCount = val;
  document.getElementById('count-input').value = '';
}
function setCountCustom(val) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  const parsed = parseInt(val, 10);
  selectedCount = (!isNaN(parsed) && parsed > 0) ? parsed : 10;
}

function updateStartBtn() {
  const anyChecked = Array.from(document.querySelectorAll('.cat-cb')).some(cb => cb.checked);
  document.getElementById('start-btn').disabled = !anyChecked;
}

/* ══════════════════════════════════════════════════════════
   QUIZ LOGIC
═══════════════════════════════════════════════════════════ */
function startQuiz(customQuestions = null) {
  missedList = [];
  streak = 0; maxStreak = 0; correctCount = 0; qIndex = 0;
  
  if (customQuestions) {
    currentQuiz = customQuestions;
  } else {
    const activeSecs = Array.from(document.querySelectorAll('.cat-cb'))
      .filter(cb => cb.checked).map(cb => cb.value);
      
    let pool = QUESTIONS.filter(q => activeSecs.includes(q.section));
    if (pool.length === 0) return;
    
    pool = shuffle([...pool]); // Fisher-Yates shuffle the question pool
    currentQuiz = (selectedCount === 'all') ? pool : pool.slice(0, selectedCount);
  }
  
  document.getElementById('q-total').innerText = currentQuiz.length;
  updateScoreUI();
  renderQuestion();
  switchScreen('screen-quiz');
}

function startMissedReview() {
  if (missedList.length === 0) return;
  const reviewQs = currentQuiz.filter((q, i) => missedList.includes(i));
  startQuiz(reviewQs);
}

function updateScoreUI() {
  document.getElementById('quiz-streak-num').innerText = streak;
  document.getElementById('quiz-correct').innerText = correctCount;
  document.getElementById('quiz-answered').innerText = qIndex;
  const pct = currentQuiz.length ? ((qIndex / currentQuiz.length) * 100) : 0;
  document.getElementById('progress-fill').style.width = `${pct}%`;
  document.getElementById('q-num').innerText = Math.min(qIndex + 1, currentQuiz.length);
}

function renderQuestion() {
  const container = document.getElementById('quiz-body');
  container.innerHTML = '';
  
  if (qIndex >= currentQuiz.length) {
    showSummary();
    return;
  }
  
  const q = currentQuiz[qIndex];
  document.getElementById('q-section-label').innerText = q.sop;
  
  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = `
    <div class="q-tags">
      <span class="q-section-tag">${q.section}</span>
    </div>
    <div class="q-text">${q.question}</div>
  `;
  
  // Render Multiple Choice with Fisher-Yates shuffle
  const mcGrid = document.createElement('div');
  mcGrid.className = 'mc-grid';
  
  let choices = [...q.choices];
  choices = shuffle(choices); // Shuffle choices correctly
  
  choices.forEach(choiceText => {
    const btn = document.createElement('button');
    btn.className = 'mc-btn';
    btn.innerText = choiceText;
    btn.onclick = () => handleMCAnswer(btn, choiceText === q.answer, q.answer, mcGrid, q);
    mcGrid.appendChild(btn);
  });
  
  card.appendChild(mcGrid);
  container.appendChild(card);
}

function handleMCAnswer(btn, isCorrect, correctText, grid, q) {
  // Disable all
  const btns = grid.querySelectorAll('.mc-btn');
  btns.forEach(b => b.disabled = true);
  
  if (isCorrect) {
    btn.classList.add('correct');
    streak++;
    if (streak > maxStreak) maxStreak = streak;
    correctCount++;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    missedList.push(qIndex);
    // highlight correct
    btns.forEach(b => {
      if (b.innerText === correctText) b.classList.add('reveal');
    });
  }
  
  const resultDiv = document.createElement('div');
  resultDiv.className = `result-bar ${isCorrect ? 'correct' : 'wrong'}`;
  resultDiv.style.marginTop = '16px';
  resultDiv.innerHTML = `
    <div class="result-icon">${isCorrect ? '✅' : '❌'}</div>
    <div>
      <div style="font-size:1.1rem; font-family:'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:1px;">
        ${isCorrect ? 'Correct' : 'Incorrect'}
      </div>
    </div>
  `;
  grid.parentElement.appendChild(resultDiv);
  
  // Inline SOP Panel
  if (q.sopKey && SOP_DATA[q.sopKey]) {
    const panelWrap = document.createElement('div');
    panelWrap.style.marginTop = '16px';
    panelWrap.innerHTML = `
      <button class="sop-toggle-btn" onclick="toggleInlineSop(this)">
        <span>📖 View SOP Reference (${q.sopKey})</span>
        <span class="sop-toggle-chevron">▼</span>
      </button>
      <div class="sop-inline-panel">
        <div class="sop-panel-inner sop-text">${SOP_DATA[q.sopKey]}</div>
      </div>
    `;
    grid.parentElement.appendChild(panelWrap);
  }
  
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-next';
  nextBtn.style.marginTop = '16px';
  nextBtn.innerText = 'Next Question →';
  nextBtn.onclick = () => {
    qIndex++;
    updateScoreUI();
    renderQuestion();
  };
  grid.parentElement.appendChild(nextBtn);
}

function toggleInlineSop(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

/* ══════════════════════════════════════════════════════════
   SUMMARY
═══════════════════════════════════════════════════════════ */
function showSummary() {
  updateScoreUI();
  switchScreen('screen-summary');
  
  document.getElementById('sum-correct').innerText = correctCount;
  document.getElementById('sum-wrong').innerText = missedList.length;
  document.getElementById('sum-streak').innerText = maxStreak;
  
  const pct = currentQuiz.length ? Math.round((correctCount / currentQuiz.length) * 100) : 0;
  document.getElementById('sum-pct').innerText = `${pct}%`;
  
  const body = document.getElementById('summary-body');
  body.innerHTML = '';
  
  const revBtn = document.getElementById('review-btn');
  if (missedList.length === 0) {
    revBtn.style.display = 'none';
    body.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text2); font-size:1.1rem;">Perfect Score! No missed questions to review.</div>`;
    return;
  }
  revBtn.style.display = 'block';
  
  const label = document.createElement('div');
  label.style.fontFamily = "'Barlow Condensed', sans-serif";
  label.style.fontSize = "1.2rem";
  label.style.fontWeight = "900";
  label.style.textTransform = "uppercase";
  label.style.marginBottom = "14px";
  label.innerText = "Missed Questions";
  body.appendChild(label);
  
  missedList.forEach(idx => {
    const q = currentQuiz[idx];
    const item = document.createElement('div');
    item.className = 'missed-item';
    item.innerHTML = `
      <div class="missed-section">${q.sop}</div>
      <div class="missed-q">${q.question}</div>
      <div class="missed-a">Correct: ${q.answer}</div>
    `;
    body.appendChild(item);
  });
}

/* ══════════════════════════════════════════════════════════
   SOP VIEWER
═══════════════════════════════════════════════════════════ */
function showSOPViewer() {
  switchScreen('screen-sop');
}
function toggleSopSidebar() {
  document.getElementById('sop-sidebar').classList.add('open');
  document.getElementById('sop-sidebar-overlay').classList.add('open');
}
function closeSopSidebar() {
  document.getElementById('sop-sidebar').classList.remove('open');
  document.getElementById('sop-sidebar-overlay').classList.remove('open');
}

function buildSopSidebar() {
  const container = document.getElementById('sop-sidebar-inner');
  container.innerHTML = '';
  
  for (const [secName, items] of Object.entries(SOP_NAV)) {
    const wrap = document.createElement('div');
    wrap.className = 'sop-nav-section-wrap';
    
    const hdr = document.createElement('div');
    hdr.className = 'sop-nav-section-hdr';
    hdr.innerHTML = `
      <span class="sop-nav-section-name">${secName}</span>
      <span class="sop-nav-chevron">▶</span>
    `;
    
    const list = document.createElement('div');
    list.className = 'sop-nav-items';
    
    items.forEach(([key, title]) => {
      const item = document.createElement('div');
      item.className = 'sop-nav-item';
      item.innerText = `${key} ${title}`;
      item.dataset.key = key;
      item.onclick = () => loadSopContent(key, item);
      list.appendChild(item);
    });
    
    hdr.onclick = () => {
      hdr.classList.toggle('expanded');
      list.classList.toggle('open');
    };
    
    wrap.appendChild(hdr);
    wrap.appendChild(list);
    container.appendChild(wrap);
  }
}

function loadSopContent(key, itemEl) {
  document.querySelectorAll('.sop-nav-item').forEach(el => el.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');
  
  const contentEl = document.getElementById('sop-content-inner');
  if (SOP_DATA[key]) {
    contentEl.innerHTML = SOP_DATA[key];
  } else {
    contentEl.innerHTML = `<div class="sop-no-results"><strong>Content not found</strong>No data available for SOP ${key}.</div>`;
  }
  
  if (window.innerWidth <= 640) closeSopSidebar();
  document.getElementById('sop-content-area').scrollTop = 0;
  
  const searchVal = document.getElementById('sop-search').value.trim();
  if (searchVal) highlightSopText(searchVal);
}

function sopSearch(query) {
  query = query.toLowerCase();
  let matchCount = 0;
  
  document.querySelectorAll('.sop-nav-section-wrap').forEach(wrap => {
    let hasVisibleChild = false;
    wrap.querySelectorAll('.sop-nav-item').forEach(item => {
      const text = item.innerText.toLowerCase();
      if (text.includes(query)) {
        item.classList.remove('hidden');
        hasVisibleChild = true;
        matchCount++;
      } else {
        item.classList.add('hidden');
      }
    });
    
    if (hasVisibleChild || query === '') {
      wrap.classList.remove('hidden');
      if (query !== '') {
        wrap.querySelector('.sop-nav-section-hdr').classList.add('expanded');
        wrap.querySelector('.sop-nav-items').classList.add('open');
      }
    } else {
      wrap.classList.add('hidden');
    }
  });
  
  document.getElementById('sop-search-count').innerText = query ? `${matchCount}` : '';
  highlightSopText(query);
}

function highlightSopText(query) {
  const contentEl = document.getElementById('sop-content-inner');
  if (!contentEl.innerHTML || contentEl.querySelector('.sop-no-results')) return;
  
  // clear old highlights
  contentEl.innerHTML = contentEl.innerHTML.replace(/<span class="sop-hl">([^<]+)<\/span>/gi, "$1");
  
  if (!query) return;
  
  // text node traversal
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, null, false);
  const nodesToWrap = [];
  
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentNode.tagName === 'SCRIPT' || node.parentNode.tagName === 'STYLE') continue;
    if (regex.test(node.nodeValue)) {
      nodesToWrap.push(node);
    }
  }
  
  nodesToWrap.forEach(textNode => {
    const span = document.createElement('span');
    span.innerHTML = textNode.nodeValue.replace(regex, '<span class="sop-hl">$1</span>');
    textNode.parentNode.replaceChild(span, textNode);
  });
}
