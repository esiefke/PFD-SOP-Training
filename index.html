<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PFD SOP Training</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap');

  :root {
    --bg:           #f2f4f7;
    --surface:      #ffffff;
    --surface2:     #f8f9fb;
    --surface3:     #edf0f5;
    --border:       #d4d9e3;
    --accent:       #1a56db;
    --accent2:      #3b82f6;
    --accent-light: #dbeafe;
    --green:        #16a34a;
    --green-light:  #dcfce7;
    --red:          #dc2626;
    --red-light:    #fee2e2;
    --yellow:       #ca8a04;
    --yellow-light: #fef9c3;
    --blue:         #1a56db;
    --text:         #1a1f2e;
    --text2:        #4b5563;
    --text3:        #9ca3af;
    --shadow:       0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg:    0 8px 24px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── HEADER ─────────────────────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .header-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 0.7rem;
    color: var(--text2);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-nav { display: flex; gap: 10px; align-items: center; }

  .btn-view-sop {
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-view-sop:hover { background: #1447c0; }

  .main { flex: 1; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }

  /* ── HOME PAGE ───────────────────────────────────────────── */
  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 4px;
  }
  .section-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .section-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  /* ── TOPIC CONTROLS (Select All / Clear All) ─────────────── */
  .topic-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .btn-topic-ctrl {
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-topic-ctrl:hover { border-color: var(--accent); color: var(--accent); }
  .btn-topic-ctrl.all:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-topic-ctrl.clear:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* ── CATEGORY TOGGLES ────────────────────────────────────── */
  .category-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .category-row:last-child { border-bottom: none; }
  .cat-info { flex: 1; }
  .cat-name  { font-size: 1rem; font-weight: 600; color: var(--text); }
  .cat-count { font-size: 0.78rem; color: var(--text2); margin-top: 2px; }

  .toggle { position: relative; width: 56px; height: 30px; flex-shrink: 0; margin-left: 12px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 30px;
    transition: 0.2s;
  }
  .toggle-slider:before {
    content: '';
    position: absolute;
    height: 22px; width: 22px;
    left: 3px; bottom: 3px;
    background: var(--text3);
    border-radius: 50%;
    transition: 0.2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(26px); background: #fff; }

  /* ── PRESET BUTTONS ─────────────────────────────────────── */
  .preset-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .preset-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 54px;
    text-align: center;
  }
  .preset-btn:hover { border-color: var(--accent2); color: var(--accent); }
  .preset-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

  .count-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 1rem;
    background: var(--surface2);
    color: var(--text);
    margin-top: 6px;
  }
  .count-input:focus { outline: none; border-color: var(--accent); }

  /* ── PRIMARY / SECONDARY BUTTONS ────────────────────────── */
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 12px rgba(26,86,219,0.3);
  }
  .btn-primary:hover { background: #1447c0; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(26,86,219,0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    width: 100%;
    padding: 14px;
    background: var(--surface);
    color: var(--text2);
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    padding: 8px 16px;
    background: var(--surface);
    color: var(--red);
    border: 2px solid var(--red);
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-danger:hover { background: var(--red); color: #fff; }

  /* ── QUIZ HEADER ─────────────────────────────────────────── */
  .quiz-header-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .quiz-progress-wrap { flex: 1; min-width: 0; }
  .quiz-progress-label {
    font-size: 0.78rem;
    color: var(--text2);
    margin-bottom: 4px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-bar-bg   { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }

  .quiz-streak-live { display: flex; align-items: center; gap: 6px; }
  .quiz-streak-live .num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .quiz-streak-live .lbl { font-size: 0.6rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
  .quiz-score-live { font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; }
  .quiz-score-live .hits { color: var(--green); }

  .quiz-body { flex: 1; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }

  /* ── QUESTION CARD ───────────────────────────────────────── */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .q-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .q-section-tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .q-sop-tag {
    display: inline-block;
    background: var(--surface3);
    color: var(--text2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .q-text {
    font-size: 1.1rem;
    line-height: 1.55;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 20px;
  }

  /* ── MULTIPLE CHOICE ─────────────────────────────────────── */
  .mc-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .mc-btn {
    padding: 14px 18px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.4;
  }
  .mc-btn:hover:not(:disabled) { border-color: var(--accent2); background: var(--accent-light); color: var(--accent); }
  .mc-btn.correct  { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }
  .mc-btn.wrong    { background: var(--red-light);   border-color: var(--red);   color: var(--red); }
  .mc-btn.reveal   { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }

  /* ── RESULT BAR ──────────────────────────────────────────── */
  .result-bar {
    padding: 14px 18px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .result-bar.correct { background: var(--green-light); color: var(--green); border: 1px solid var(--green); }
  .result-bar.wrong   { background: var(--red-light);   color: var(--red);   border: 1px solid var(--red); }
  .result-bar .result-icon { font-size: 1.2rem; flex-shrink: 0; }
  .result-explanation { font-size: 0.88rem; color: var(--text2); line-height: 1.5; margin-top: 8px; padding: 12px 16px; background: var(--surface3); border-radius: 8px; }

  .btn-next {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 10px;
  }
  .btn-next:hover { background: #1447c0; }

  /* ── INLINE SOP REVIEW PANEL ─────────────────────────────── */
  .sop-toggle-btn {
    width: 100%;
    padding: 11px 16px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sop-toggle-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .sop-toggle-btn.open  { border-color: var(--accent); color: var(--accent); background: var(--accent-light); border-style: solid; }
  .sop-toggle-chevron { font-size: 0.75rem; transition: transform 0.2s; }
  .sop-toggle-btn.open .sop-toggle-chevron { transform: rotate(180deg); }

  .sop-inline-panel {
    display: none;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .sop-inline-panel.open { display: block; }
  .sop-panel-inner {
    padding: 20px;
    max-height: 380px;
    overflow-y: auto;
  }

  /* SOP text formatting — used in both inline panel and SOP viewer */
  .sop-text h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent-light);
  }
  .sop-text h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-top: 14px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .sop-text p {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .sop-text ul, .sop-text ol { margin: 6px 0 10px 20px; }
  .sop-text li {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text2);
    margin-bottom: 4px;
  }
  .sop-text strong { color: var(--text); }
  
  /* Additional table styling for SOP viewer */
  .sop-text table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .sop-text th, .sop-text td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .sop-text th {
    background-color: var(--surface2);
    font-weight: 700;
    color: var(--text);
  }

  /* Search highlight */
  .sop-hl {
    background: #fef08a;
    color: #713f12;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── SUMMARY SCREEN ──────────────────────────────────────── */
  .summary-top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 24px 20px; }
  .summary-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 10px;
    text-align: center;
  }
  .stat-card.green { background: var(--green-light); border-color: var(--green); }
  .stat-card.red   { background: var(--red-light);   border-color: var(--red); }
  .stat-card.blue  { background: var(--accent-light); border-color: var(--accent); }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1;
  }
  .stat-card.green .stat-val { color: var(--green); }
  .stat-card.red   .stat-val { color: var(--red); }
  .stat-card.blue  .stat-val { color: var(--accent); }
  .stat-lbl { font-size: 0.72rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .summary-btns { display: flex; flex-direction: column; gap: 10px; }

  .summary-body { flex: 1; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }
  .missed-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .missed-section { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .missed-q { font-size: 0.92rem; color: var(--text2); margin-bottom: 8px; line-height: 1.4; }
  .missed-a { font-size: 0.95rem; font-weight: 600; color: var(--green); }

  /* ── SOP VIEWER SCREEN ───────────────────────────────────── */
  #screen-sop {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }
  .sop-viewer-header {
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .btn-sop-back {
    padding: 8px 14px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-sop-back:hover { border-color: var(--accent); color: var(--accent); }
  .sop-viewer-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
    display: none;
  }
  .sop-search-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .sop-search {
    flex: 1;
    padding: 9px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    background: var(--surface2);
    color: var(--text);
    min-width: 0;
  }
  .sop-search:focus { outline: none; border-color: var(--accent); }
  .sop-search-count {
    font-size: 0.78rem;
    color: var(--text3);
    white-space: nowrap;
    font-weight: 600;
    min-width: 40px;
    text-align: right;
  }

  /* Mobile sidebar toggle */
  .btn-sop-sidebar-toggle {
    display: none;
    padding: 8px 12px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .sop-viewer-body {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── SOP SIDEBAR ─────────────────────────────────────────── */
  .sop-sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .sop-sidebar-inner { padding: 8px 0; }

  .sop-nav-section-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
  }
  .sop-nav-section-hdr:hover { background: var(--surface2); }
  .sop-nav-section-hdr.active { background: var(--accent-light); }
  .sop-nav-section-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
  }
  .sop-nav-section-hdr.active .sop-nav-section-name { color: var(--accent); }

const SOP_DATA = {
"1.1":"<h2>Communications</h2><h3><strong>PURPOSE:</strong></h3><p>To establish a clear radio communications model for the Piedmont Fire Department to follow while responding to and operating at incidents.</p><h3><strong>DISCUSSION:</strong></h3><p>This procedure is to be followed by all officers and members of the Piedmont Fire Department and is established to ensure streamlined effective communications while responding to and operating at incident scenes. All PFD members are to utilize “common language or terms” when utilizing radios. “Ten” codes shall not be utilized for radio traffic. See the Common Terms section for a description of PFD common terms.</p><h3><strong>COMMON TERMS:</strong></h3><ul><li><strong>Responding:</strong> Unit responding to an incident. All units responding in a PFD apparatus shall notify dispatch when responding. <em>(Example: “Engine 1 is responding”)</em></li><li><strong>On Scene:</strong> Used to indicate arrival on a scene by a PFD apparatus. <em>(Example: “Engine 1 is on scene”)</em></li><li><strong>Cancel(ed):</strong> Used to cancel a PFD unit. <em>(Example: “Engine 1 you can cancel per the alarm company”)</em></li><li><strong>In service:</strong> Units have left the scene and are returning to service or remaining on the scene but are available for another response. <em>(Example: “Engine 1 is in service” or “Engine 1 is in service and returning to the station”)</em></li><li><strong>PAR:</strong> Personal Accountability Report. This is completed during high risk or complex scenes to ensure command that all units are accounted for. See section (5.2 Fireground Accountability for more information. For dispatch, this is a benchmark time to be logged. <em>(Example: “Command to Dispatch PAR complete”)</em></li><li><strong>Water on fire:</strong> Used as a benchmark time for dispatch, time that hose lines are in operation and extinguishing the fire. <em>(Example: “Command to Dispatch water on the fire”)</em></li><li><strong>Primary Complete:</strong> Used as a benchmark time for dispatch. Time that the primary “rapid” search of a residence is complete.</li><li><strong>Secondary Complete:</strong> Used as a benchmark time for dispatch. Time that the secondary “detailed” search of a residence is complete.</li><li><strong>Fire Contained:</strong> Used as a benchmark time for dispatch. Time that the loss is stopped, or the forward progress of the fire is stopped.</li><li><strong>Fire Out:</strong> Used as a benchmark time for dispatch. Time that the fire is out.</li><li><strong>Mop up / Overhaul:</strong> Used as a benchmark time for dispatch. Time that fire units transition from fire attack to clean up and investigation.</li><li><strong>Emergency Traffic:</strong> Means that there is a potential threat to life. All radio traffic on the channel is to STOP, allowing command to communicate clearly with the affected unit, only communicate if you are the affected unit or contacted by command.</li></ul><h3><strong>GUIDELINE:</strong></h3><p>The Piedmont Fire Department operates on the Harris 800MHz (Oklahoma City) radio system. All apparatus are also equipped with a VHF radio for mutual aid purposes and a back up radio system. Our primary talk group contains:</p><ul><li>Piedmont FD</li><li>PFD TAC 1</li><li>PFD TAC 2</li><li>PFD OPS (Encrypted)</li><li>PFD TRAIN (Encrypted)</li></ul><p>There are multiple other agencies within our primary talk group, but the above listed will be the only channels utilized the majority of the time. Different talk groups will allow us to communicate with different agencies, including those agencies operating on the OKWIN System.</p><h4>When communicating with other units or dispatch, utilize the following guidelines:</h4><ul><li>When transmitting, wait for the tone to begin speaking.</li><li>Keep some distance between the microphone and your mouth.</li><li>Speak clearly and calmly.</li><li>Always identify who you are and who you are transmitting to. <em>(Example: Engine 1 to Headquarters” or “Brush 3 to Brush 2”)</em></li><li>When responding back to a unit, identify yourself and tell them to proceed with their message. <em>(Example: “Brush 3 to Brush 2….. Brush 2 Go Ahead”)</em></li><li>To verify that the message has been fully understood, the receiver should repeat the context of the transmission. <em>(Example: “ Brush 3 to Brush 2. Brush 2 Go Ahead. Brush 2 proceed to the northern flank. Brush 2 is clear on proceeding to the north flank”)</em></li></ul><p>Command Staff should be familiar with all available talk groups and channels. Command Staff should be capable of communicating with multiple agencies on multiple channels.</p><p>TAC channels may be utilized during instances where the amount of radio traffic warrants different operations operate on different channels, such as a large incident or multiple incidents at the same time.</p><p>If the Incident Commander deems it necessary to switch from our primary channel to a TAC channel, they must assure that all units are clear on the channel they need to be operating on. The switching of channels should never be done while operating as fire attack.</p><p>The Incident Commander must be able to monitor our primary channel as well as the TAC channel that they are operating on.</p><h4>General Radio Procedures</h4><ul><li>Radio transmissions of an emergency nature shall always take priority of all other radio traffic.</li><li>Be short and specific. Before speaking, know what you are going to say, do not make it up as you go along. Choose precise terms to communicate the desired message as clearly and briefly as possible without wasting air time.</li><li>Speak clearly at a normal rate, not too fast or too slow.</li><li>Control your emotions and excitement deliberately. If you do not consciously control your voice, it will become garbled under stress.</li><li>Do not use up valuable air time with unimportant messages and insignificant details.</li><li>Do not interrupt conversations unless you have emergency traffic. Listen before transmitting and wait until a message transaction has been completed.</li><li>Pause between consecutive messages. This will make it clear when one message has been completed and another message started. It will also give other units a chance to get on the air with important messages.</li><li><strong>Above All, Be Professional.</strong></li></ul><p>All personnel shall maintain access to their issued portable radios at all times while operating on the fire ground or in an accessory manner. This includes but is not limited to interior operations, exterior operations, apparatus engineer, hydrant operations, etc.</p><h4>Lost or Stolen Radio Equipment</h4><p>If a radio or equipment is <strong>lost</strong>, the firefighter who was assigned and/or using the equipment at the time it was lost will:</p><ol><li>Immediately notify the on duty shift commander.</li><li>Complete a detailed incident report documenting the exact details of the event.</li></ol><p>If a radio or equipment is <strong>stolen</strong>, the firefighter who was assigned and/or using the equipment at the time it was stolen will:</p><ol><li>Immediately notify the on duty shift commander.</li><li>Assure that a report is filed with the appropriate law enforcement agency where the event occurred.</li><li>Assure that Piedmont Police are notified of the event.</li></ol>",
"1.2":"<h2>Dispatch Guidelines</h2><p>The Piedmont Fire Department is dispatched by:</p><ul><li>Monday – Thursday 0730 to 1230: <strong>City of Piedmont Dispatch</strong></li><li>Monday – Thursday 1230 to 1330: <strong>City of Yukon Dispatch</strong></li><li>Monday – Thursday 1330 to 1730: <strong>City of Piedmont Dispatch</strong></li><li>Monday – Thursday 1730 to 0730: <strong>City of Yukon Dispatch</strong></li><li>Friday 0730 to 1130: <strong>City of Piedmont Dispatch</strong></li><li>Friday 1130 to Monday 0730: <strong>City of Yukon Dispatch</strong></li></ul><p>All holidays covered by The City of Yukon Dispatch. Any time Piedmont City Hall is closed, covered by The City of Yukon Dispatch.</p><p>The Public Safety Answering Point for Piedmont is located at the Yukon Dispatch Center. All 911 calls are received at our PSAP. 911 calls are transferred to Piedmont Dispatch during their designated hours.</p>",
"1.3":"<h2>Apparatus List</h2><h3><strong>PURPOSE:</strong></h3><p>To describe the capabilities and normal staffing for Piedmont Fire Department apparatus. Staffing levels may change depending on the situation.</p><h3><strong>Apparatus:</strong></h3><ul><li><strong>Engine 1</strong><br>2020 Pierce Enforcer | 1500gpm Waterous Pump | 1000 Gallon Tank<br><em>Equipment:</em> x4 MSA SCBAs, TNT Battery Powered Extrication Tools, Hydrant Assist Valve, Blitz Fire, Full Ladder Compliment, BLS Medical Bag, Dewalt Tools, Res-Q Extrication Struts and Jacks, 150ft Trash Line, 200ft and 250ft Preconnects, 200ft 2.5” Preconnect, 1300ft LDH, 200ft Booster Line, 10 Gallons of Foam.</li><li><strong>Engine 2</strong><br>2003 Pierce Contender | 1250gpm Pump | 1000 Gallon Tank<br><em>Equipment:</em> x4 MSA SCBAs, Full Ladder Compliment, 150ft Trash Line, 200ft and 250ft Preconnects, 200ft 2.5” in the Hose Bed, 1300ft LDH, 10 Gallons of Foam.</li><li><strong>Engine 3</strong><br>2021 Pierce Enforcer | 1500gpm Waterous Pump | 1000 Gallon Tank<br><em>Equipment:</em> x4 MSA SCBAs, TNT Battery Powered Extrication Tools, Hydrant Assist Valve, Blitz Fire, Full Ladder Compliment, BLS Medical Bag, Dewalt Tools, Res-Q Extrication Struts and Jacks, 150ft Trash Line, 200ft and 250ft Preconnects, 200ft 2.5” Preconnect, 1300ft LDH, 200ft Booster Line, 10 Gallons of Foam.</li><li><strong>Engine 4</strong><br>1999 E-One | 1500gpm Pump | 500 Gallon Tank<br><em>Equipment:</em> x3 MSA SCBAs, Full Ladder Compliment, 55ft Aerial Waterway, 150ft Trash Line, 200ft and 250ft Preconnects, 200ft 2.5” in the Hose Bed, 1300ft LDH, 60 Gallons of Foam.</li><li><strong>Tanker 1</strong><br>1994 International/Westex | 1000gpm Pump | 2500 Gallon Tank<br><em>Equipment:</em> 20 Gallons of Foam, x2 Avon SCBAs, 2500 Gallon Portable Tank, 200ft and 250ft Preconnects.</li><li><strong>Tanker 2</strong><br>2007 Freightliner/Osco | 750gpm Pump | 3000 Gallon Tank<br><em>Equipment:</em> 2x 3000 Gallon Portable Tank.</li><li><strong>Brush Pumper 1</strong><br>2016 Ford-F550 | 400 Gallon Tank<br><em>Equipment:</em> Dewalt Chainsaw, Winch, 2x Whip Lines, 150ft Booster Line.</li><li><strong>Brush Pumper 2</strong><br>2006 Ford-F350 | 350 Gallon Tank<br><em>Equipment:</em> Winch, 2x Whip Lines, 150ft Booster Line.</li><li><strong>Brush Pumper 3</strong><br>2015 Ford-F550 | 400 Gallon Tank<br><em>Equipment:</em> Winch, x2 Flexible Suction, 2x Whip Lines, 150ft Booster Line.</li><li><strong>Utility 1</strong><br>2019 Ford-F250<br><em>Equipment:</em> As needed.</li><li><strong>Command 1</strong><br>2018 Chevrolet Tahoe<br><em>Equipment:</em> Medical Bag, Command Equipment.</li><li><strong>Command 2</strong><br>2012 Chevrolet Tahoe<br><em>Equipment:</em> Medical Bag, Command Equipment.</li></ul>",
"1.4":"<h2>Response Packages</h2><h3><strong>PURPOSE:</strong></h3><p>To define consistent procedures for the proper selection and staffing of responding apparatus and the order in which they respond based on a given incident and its location.</p><h3><strong>DISCUSSION:</strong></h3><p>This procedure will help ensure the correct apparatus and personnel respond in the proper order to mitigate a specific incident. The apparatus specifically named in this procedure are the standard response for each incident type. Apparatus labeled (Automatic) respond immediately. Apparatus labeled (Stand By) shall be ready to respond upon the request of the OIC if staffing allows. The Piedmont Fire Department regularly rotates apparatus to extend the life of the apparatus. Engine 1, Engine 3, Brush 1 and Brush 3 are rotated on a weekly basis. For those specific apparatus, rather than being identified as (Engine 1, etc), it will be referred to as (Primary Engine) or (Secondary Brush).</p><h3><strong>GUIDELINES:</strong></h3><h3>Structure Fire – Residential – With Available Hydrant</h3><ul><li>Primary Engine (Automatic)</li><li>Secondary Engine (Automatic) (Once Staffed)</li><li>Engine 4 (Automatic) (Once Staffed)</li><li>Tanker 1 (Automatic) (Once Staffed)</li></ul><h3>Structure Fire – Residential – Without Available Hydrant</h3><ul><li>Primary Engine (Automatic)</li><li>Tanker 1 (Automatic)</li><li>Secondary Engine (Automatic) (Once Staffed)</li><li>Tanker 2 (Automatic) (Once Staffed)</li></ul><h3>Structure Fire – Commercial – With Available Hydrant</h3><ul><li>Primary Engine (Automatic)</li><li>Secondary Engine (Automatic) (Once Staffed)</li><li>Engine 4 (Automatic) (Once Staffed)</li><li>Tanker 1 (Automatic) (Once Staffed)</li></ul><h3>Structure Fire – Commercial – Without Available Hydrant</h3><ul><li>Primary Engine (Automatic)</li><li>Tanker 1 (Automatic)</li><li>Secondary Engine (Automatic) (Once Staffed)</li><li>Tanker 2 (Automatic) (Once Staffed)</li><li>Engine 4 (Automatic) (Once Staffed)</li></ul><h3>Vehicle Fire (Outside of Structure)</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Tanker 1 (Stand By)</li><li>Primary Brush (Stand By)</li></ul><h3>Automatic Fire Alarm – Residential</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Secondary Engine (Stand By)</li></ul><h3>Automatic Fire Alarm – Commercial</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Secondary Engine (Stand By)</li><li>Engine 4 (Stand By)</li></ul><h3>Motor Vehicle Accident</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Secondary Engine (Automatic) (Once Staffed)</li></ul><h3>Grass Fire</h3><ul><li>Primary Brush (Automatic)</li><li>Primary Engine (Automatic)</li><li>Tanker (Automatic) (Once Staffed)</li><li>Secondary Brush (Automatic) (Once Staffed)</li></ul><h3>Aircraft Accident</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Brush (Automatic)</li><li>Tanker (Automatic) (Once Staffed)</li><li>Engine 4 (Automatic) (Once Staffed)</li></ul><h3>Dumpster Fire</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Tanker (Stand By)</li><li>Primary Brush (Stand By)</li></ul><h3>Hazardous Materials Incidents</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li><li>Engine 4 (Automatic) (Once Staffed)</li></ul><h3>Oil Field Fires</h3><ul><li>Primary Engine (Automatic)</li><li>Tanker 1 (Automatic)</li><li>Primary Brush (Automatic) (Once Staffed)</li><li>Tanker 2 (Automatic) (Once Staffed)</li></ul><h3>Power Line Down</h3><ul><li>Primary Brush (Automatic)</li><li>Primary Engine (Automatic)</li></ul><h3>Medical Aid</h3><ul><li>Primary Engine (Automatic)</li><li>Primary Support Vehicle (Automatic if staffing allows)</li></ul><h3>Mutual Aid Requests</h3><ul><li>Specific Apparatus Requested</li><li>Assurance of adequate staffing for Fire Station 1.</li></ul><h3>Automatic Aid Requests</h3><ul><li>Specific Apparatus Requested</li><li>Minimum of one FF required to remain at Fire Station 1</li></ul><p><em>Note: The Shift Commander is authorized to add a Brush Pumper to any response package during periods of extreme wild fire danger.</em></p>",
"1.5":"<h2>Incident Command</h2><h3><strong>I. PURPOSE:</strong></h3><p>To establish guidelines to develop, facilitate, and accomplish the tactical and strategic objectives of the Piedmont Fire Department (PFD) incident command system.</p><h3><strong>II. DISCUSSION:</strong></h3><p>The PFD has adopted NIMS/ICS (ICS) as its incident command system. ICS will be used at all dispatched incidents responded to by the PFD. As an incident grows in scope, this procedure will also establish guidelines for the modular expansion of the ICS using the NIMS structure and terminology.</p><h3><strong>III. GUIDELINE:</strong></h3><h4><strong>NIMS (National Incident Management System)</strong></h4><p>The most significant characteristic of NIMS is its ability to expand from a routine incident to a complex, multiagency incident in a logical progression. Other important characteristics include:</p><ul><li>The Incident Command System (ICS) is always to be used.</li><li>It is an all-hazards system, adaptable to all types of emergency incidents.</li><li>Jurisdictional authority is established based upon the geographic location of the incident.</li><li>Reducing span of control is the basis for modular expansion of ICS.</li><li>A unity of command is clearly established by the organizational format.</li><li>Uses common terms, organizational structures, and operational guidelines that are nationally accepted as the standard for incident management.</li><li>The activities and responsibilities assigned to the Incident Commander (IC) and other individuals operating within the ICS are well defined.</li><li>A system should be provided to process information that supports incident management, planning, and decision-making.</li></ul><h4><strong>Tactical Guidelines</strong></h4><p>These tactical guidelines are the basis for the PFD’s emergency incident operations and include the steps the IC must complete during an incident.</p><ol><li><strong>Provide Initial Report / Size-Up.</strong> The first arriving Piedmont unit, member, or officer at the scene of a response will transmit, via radio, a brief initial report of the obvious scene conditions, including:<ul><li>Unit identification, address, or location confirmation.</li><li>A description of the building or location of the emergency.</li><li>Obvious incident conditions.</li><li>Establish incident command and state the location of the command post, and the tactical channel assigned to the incident.</li><li>A report of actions being taken by the unit’s on-scene.</li></ul></li><li><strong>Establish Incident Command</strong><ul><li>Responsibility for incident command is on a single member. The first arriving apparatus officer will establish incident command.</li><li>The location, followed by “Command”, will be the radio designation for the IC (e.g., “5th street Command”).</li><li>A strong, direct and visible command will be established at the arrival of the first radio equipped member and maintained until command is terminated.</li><li>There will be an orderly transfer of command to subsequent commanders as per SOP 1.6 TRANSFER OF COMMAND.</li></ul></li><li><strong>Establish Incident Priorities</strong><ul><li>Command will establish the incident priorities in the order below: 1. Life Safety, 2. Incident Stabilization, 3. Property Conservation.</li><li>Ongoing evaluation of the incident priorities is required. Life Safety and Incident Stabilization may be addressed simultaneously in order to accomplish the overall objective of incident mitigation.</li></ul></li><li><strong>Determine Mode of Operation</strong><ul><li><strong>Investigative:</strong> The IC observes nothing showing. The IC assigns units to investigate the situation.</li><li><strong>Offensive:</strong> The IC observes a working fire or an active release of hazardous materials that can be controlled by aggressive actions of first due companies. This mode includes obvious rescue situations.</li><li><strong>Defensive:</strong> The IC observes conditions too dangerous for aggressive interior actions or observes large releases of unknown hazardous materials.</li></ul></li><li><strong>Continually Analyze the Need for ICS Expansion</strong> (See Modular Expansion below)</li><li><strong>Address Safety /Accountability</strong><ul><li>Establish exclusion/hot/warm/cold/collapse zones based upon conditions.</li><li>Assign incident safety officer(s) if necessary.</li><li>Establish an accountability system (see SOP 5.2).</li><li>Implement the appropriate level of accountability (I or II).</li><li>Assign an “Accountability/Entry Control Officer” if necessary.</li></ul></li><li><strong>Develop Incident Action Plan</strong> (IAP)</li><li><strong>Implement Incident Action Plan</strong></li><li><strong>Provide Progress Reports</strong><ul><li>IC should provide periodic progress reports via the radio every fifteen (15) minutes or at intervals appropriate for the incident.</li><li>Tactical benchmarks require formal transmission: <strong>“Primary Complete”</strong> and <strong>“Under Control”</strong>.</li></ul></li><li><strong>Incident Termination and Demobilization</strong><ul><li>The IC will notify dispatch when the incident is completed by stating that “Command has been terminated. All units are clear of the scene”.</li><li>Rehab all personnel prior to termination.</li></ul></li></ol><h4><strong>Modular Expansion of ICS</strong></h4><p>One (1) supervisor/manager to five (5) direct subordinates is the ideal span of control. If at any time the span of control goes above 5 to 1, then another level of supervision should be added. The IC will decide on one of various structures for managing company operations:</p><ul><li><strong>Sections:</strong> Operations Section, Finance Section, Logistics Section, Planning Section.</li><li><strong>Branches:</strong> An organizational level that may be inserted between the IC or the Operations Section and Division/Groups.</li><li><strong>Groups:</strong> Developed when multiple companies are operating as functional units to accomplish incident objectives (e.g., “Fire Control,” “Ventilation”).</li><li><strong>Divisions:</strong> Established when multiple companies are operating in a defined geographic location.<ul><li><strong>Exterior Divisions (Sides):</strong> Division “A” (Alpha) is the front/addressed side. Division “B” (Bravo) is the left side. Division “C” (Charlie) is the rear. Division “D” (Delta) is the right side.</li><li><strong>Interior Divisions:</strong> Refers to specific floors (Division 1, Division 2, Roof Division, Subdivision 1 for basements).</li></ul></li><li><strong>Single Resource/Company-Level Assignments:</strong> When one company is assigned to one task, the IC uses that company’s designation (e.g., “E-1” or “Interior Team 1”).</li></ul>",
"1.6":"<h2>Transfer of Command</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines and responsibilities for personnel to safely, efficiently and quickly conduct an on scene transfer of command at incidents being managed by the Piedmont Fire Department (PFD).</p><h3><strong>II. DISCUSSION:</strong></h3><p>The transfer of command typically occurs in a stressful environment during the active stages of an emergency incident and so must be conducted in a consistent manner. This guideline addresses critical items that must be included in a transfer and the parameters used by the PFD when transfer of command occurs.</p><h3><strong>III. GUIDELINE:</strong></h3><ol><li>Transfers of command should be accomplished on a “face-to-face” basis. Certain conditions may necessitate transfer of command via radio (e.g., first arriving officer has assumed command and is in fast attack mode inside a structure when a second unit or another officer arrives).</li><li>Transfer of command can occur for a variety of reasons:<ul><li>A more qualified person arrives on the scene.</li><li>An incident escalates to the point where a different agency should assume command.</li><li>An incident commander (IC) can no longer effectively command an incident.</li><li>An IC wishes to relinquish command.</li></ul></li><li>Transfer of command should occur for a reason.<ul><li>When a higher-ranking member arrives on scene and makes their presence known to the IC, the IC shall offer to transfer command to that member.</li><li>The higher-ranking member shall make the decision to transfer command or leave the existing IC in place.</li><li>If command has been assumed by a member of a mutual aid fire department or other agency for an incident in the Piedmont Fire district the first arriving Piedmont member with a radio should confer with the current IC to determine if command will be transferred to the Piedmont member or remain with the current IC. Command should not be assumed by the Piedmont member just for the sake of transferring command to PFD.</li></ul></li><li>A transfer briefing shall occur between the current IC and incoming IC. The following information should be exchanged:<ul><li>Incident conditions (fire location and extent, Haz-Mat spill or release, number of patients, etc).</li><li>Incident Action Plan.</li><li>Tactical objectives and any completed objectives.</li><li>The effectiveness of the current IAP.</li><li>Safety considerations.</li><li>Assignments of operating companies.</li><li>Appraisal of the need for additional resources.</li></ul></li><li>After the transfer briefing, the incoming IC should inform dispatch (and units operating on scene) that command is being transferred to a new IC. The new IC should be identified in the communication. For example, “601 Headquarters” followed by “601 is now Regional Command”.</li></ol>",
"1.7":"<h2>Public Events</h2><h3><strong>I. PURPOSE:</strong></h3><p>To define consistent guidelines for the proper selection and staffing of apparatus when attending nonpaid public events.</p><h3><strong>II. DISCUSSION:</strong></h3><p>This guideline will help ensure the correct apparatus and personnel are available to respond if all personnel are out of the station attending a public event. The OIC must take staffing levels and weather conditions into account when making a decision to vacate the station for a public event. All fire apparatus on site of a public event will be non-dedicated unless otherwise arranged. Dedicated apparatus will require staffing discussions.</p><h3><strong>III. GUIDELINE:</strong></h3><p>The following apparatus must be available at the event if the station is left unmanned. Apparatus must be staged in a location that allows for immediate response and minimum staffing level must be maintained. The Chief or their designee shall be notified of the location and duration of the event, all events attended must allow for immediate response.</p><ul><li>Primary Engine</li><li>Command 2</li><li>Brush Pumper (If threat of wildfire exists).</li></ul>",
"2.1":"<h2>Residential Single Family Structure Fire</h2><h3><strong>I. Purpose</strong></h3><p>To establish guidelines for fire department personnel in the placement and use of apparatus, equipment, and personnel at single-family residential structure fires, including manufactured, modular, and large estate dwellings.</p><h3><strong>II. Discussion</strong></h3><p>This SOG outlines the roles, responsibilities, and priorities for fire department personnel during incidents involving single-family residences. These structures may present unique challenges, including entrapped occupants, access and egress issues, hazardous materials, and structural or mechanical hazards.</p><h3><strong>III. Guideline</strong></h3><h4><strong>Command Priorities</strong></h4><p>The first arriving officer shall establish command and coordinate initial operations. Command may be transferred to a Chief Officer upon arrival if necessary.</p><h4><strong>Pre-Arrival Considerations</strong></h4><p>While en route, responding personnel should develop an initial strategy based on the following:</p><ul><li>Reference materials (e.g., pre-plans, maps, building type, and occupancy).</li><li>Available resources (apparatus, personnel, and estimated arrival times).</li><li>Weather conditions (wind direction, speed, and precipitation).</li><li>Occupancy status (occupied, vacant, fuel load).</li><li>Time of day (visibility, occupancy status, response times).</li></ul><h4><strong>Initial On-Scene Factors</strong></h4><p>The initial arriving officer shall evaluate the following conditions:</p><ul><li>Witness or bystander statements. Knowledge of Occupants.</li><li>Property access.</li><li>Building size, height, and stability.</li><li>Occupancy type and construction.</li><li>Wind direction and fire/smoke location.</li><li>Fire growth potential and smoke flow path.</li><li>Exposures and fixed fire protection systems.</li><li>Available resources.</li></ul><h4><strong>Tactical Objectives</strong></h4><p>Conduct a 360° assessment and establish a strategy. The primary mission is life safety, with tactical priorities summarized using the RECEOVS mnemonic:</p><ol><li><strong>Rescue:</strong> Identify tenable spaces and establish search and rescue teams. Conduct primary searches in all accessible areas.</li><li><strong>Exposures:</strong> Protect exposed structures and control loss.</li><li><strong>Confinement:</strong> Contain the fire to its origin.</li><li><strong>Extinguishment:</strong> Suppress the fire effectively.</li><li><strong>Ventilation:</strong> Manage flow paths to improve conditions and prevent fire spread.</li><li><strong>Overhaul:</strong> Check for hidden hot spots and fire extension.</li><li><strong>Salvage:</strong> Preserve property and evidence whenever possible.</li><li><strong>Fire Investigation.</strong></li></ol><h4><strong>Operational Priorities</strong></h4><ul><li><strong>Primary Engine:</strong> Primary fire attack, primary water supply and search engine.</li><li><strong>Secondary Engine:</strong> Responsible for additional search operations and assist with water supply.</li><li>Additional arriving members report to Incident Command for assignment.</li></ul><h4><strong>Search Operations:</strong></h4><p>Search operations will integrate both traditional search methods and the <strong>VEIS (Vent, Enter, Isolate, Search)</strong> technique to ensure the safety of occupants and firefighters.</p><ul><li><strong>Primary Search:</strong> Conduct a rapid, systematic search of tenable spaces for potential occupants, prioritizing areas of highest likelihood, such as bedrooms and escape routes. Use wall-following techniques and maintain team communication at all times. Utilize thermal imaging cameras (TIC). Notify Incident Command immediately upon locating victims.</li><li><strong>Secondary Search:</strong> Perform a thorough, detailed search of all areas after initial fire suppression and ventilation efforts have improved conditions. Assign personnel not involved in the primary search. Document and report all findings.</li><li><strong>VEIS Technique:</strong><ul><li><strong>Vent:</strong> Ventilate the identified room or area from the exterior to allow access and improve conditions.</li><li><strong>Enter:</strong> Enter through the ventilated opening using proper PPE and SCBA.</li><li><strong>Isolate:</strong> Close the door to the room to contain fire and smoke and protect both occupants and firefighters.</li><li><strong>Search:</strong> Perform a targeted, systematic search within the isolated space.</li></ul></li></ul><h4><strong>Water Supply</strong></h4><ul><li><strong>Small or Unknown Fire:</strong> Position Primary Engine for tank water use.</li><li><strong>Substantial Fire:</strong> Connect Primary Engine directly to a hydrant within one block. If necessary, Secondary Engine performs a reverse lay and establishes supply. Monitor hydrant pressures per SOP 2.11.</li><li><strong>Rural Fires:</strong> Follow water supply methods outlined in SOP 2.12 (portable tanks, dry hydrants, natural water sources).</li></ul><h4><strong>Fire Control Methods</strong></h4><ul><li><strong>Offensive Mode:</strong><ul><li><strong>Exterior Transitional Attack:</strong> Apply water from outside to improve interior conditions.</li><li><strong>Interior Advancement:</strong> Progress safely to the fire seat while cooling superheated layers.</li><li><strong>Interior Fire Control:</strong> Suppress the fire directly with appropriate flow rates and nozzle techniques.</li></ul></li><li><strong>Defensive Mode:</strong> Focus on exposure protection and use master streams. Avoid collapse zones. Conduct accountability checks when transitioning from interior to defensive operations.</li></ul><h4><strong>Evacuation Procedure</strong></h4><p>If evacuation is necessary:</p><ul><li>Announce: \"Command to all units, evacuate the structure.\"</li><li>Signal: Use apparatus air horns (Six (6) 5 second blasts, with a 3 second pause between blasts for one minute).</li><li>Alternative: Utilize SCBA communication systems if in use.</li></ul>",
"2.2":"<h2>Structure Fire (Multi-family dwellings)</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the placement and use of apparatus, equipment, and personnel at residential multi-family dwelling fires, including apartments, up to 4-story hotels, and group homes.</p><h3><strong>II. DISCUSSION</strong></h3><p>Multi-family residences present unique challenges, such as entrapped occupants, crowded conditions, difficult access and egress, hazardous materials, multiple stories, common attics, and non-compliant structural and mechanical hazards. This SOG defines fire department roles, responsibilities, and priorities to address these challenges effectively.</p><h3><strong>III. GUIDELINE</strong></h3><p>The following guideline outlines recommended actions and priorities for incidents involving multi-family dwellings.</p><h4><strong>Operational Priorities & Apparatus Assignments:</strong></h4><ul><li><strong>First Engine:</strong> Responsible for primary fire attack and primary search, securing a water supply, and protecting access for additional units. This includes deploying the initial handline, ensuring proper placement to allow space for aerial apparatus, and prioritizing water supply.</li><li><strong>Second Engine:</strong> Responsible for ventilation, assisting with search and rescue operations, supporting the initial attack, supplying the FDC and establishing backup lines.</li><li><strong>Third Engine or Engine 4:</strong> Responsible for assisting with ventilation, supporting initial attack and search and rescue operations. Establishing a secondary water supply, protecting exposures, and assisting with large-scale fire suppression if necessary.</li></ul><h4><strong>Fire Control & Extinguishment:</strong></h4><ul><li><strong>Exterior Control (Transitional Attack):</strong> Use a solid or straight stream directed through openings into the fire compartment to cool the upper thermal layer to improve conditions for interior attack.</li><li><strong>Interior Advancement:</strong> Use a straight stream or smooth-bore nozzle for cooling as the crew advances. Regularly assess conditions with a thermal imaging camera (TIC). Maintain coordination with ventilation teams to control flow paths.</li><li><strong>Direct Fire Control:</strong> Extinguish the fire at its seat. Avoid excessive water application that may cause structural damage or water weight hazards.</li><li><strong>Defensive Mode:</strong> When conditions prevent interior operations. Deploy large-diameter hose lines or aerial devices for master stream application. Focus on protecting exposures and preventing fire spread.</li></ul><h4><strong>Enhanced Fire Attack Tactics:</strong></h4><ul><li><strong>Fire Compartment Isolation:</strong> Identify and close doors to confine the fire and limit flow path. This reduces oxygen availability and slows fire growth while improving tenability.</li><li><strong>Ventilation Coordination:</strong> Ensure ventilation is controlled and timed with fire attack. Avoid premature ventilation.</li><li><strong>Basement Fires:</strong> Approach from the exterior if possible; avoid stairwells where heat and gases are concentrated. Use a piercing nozzle to apply water into the fire area indirectly before entry.</li></ul><h3><strong>IV. SEARCH OPERATIONS IN LARGE MULTISTORY BUILDINGS</strong></h3><ul><li><strong>Vertical Searches:</strong> Assign separate teams to each floor; focus on stairwells and egress routes. Prioritize areas above the fire due to increased risk from heat and smoke. Evaluate roof access points for potential victim locations.</li><li><strong>Techniques:</strong> Assign teams of at least two members. Utilize TICs and forcible entry tools. Mark rooms systematically to indicate areas searched. Coordinate with fire attack teams.</li></ul>",
"2.3":"<h2>Commercial Structure Fire</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the placement and use of apparatus, equipment, and personnel at commercial structure fires.</p><h3><strong>II. DISCUSSION</strong></h3><p>Commercial structures present unique challenges, such as entrapped occupants, difficult access and egress, heavy fuel loads, hazardous materials, multiple exposures, and non-compliant structural and mechanical hazards. This SOG defines fire department roles, responsibilities, and priorities to address these challenges effectively.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Operational Priorities:</strong></h4><ul><li>Establish incident command.</li><li>Secure two adequate water supplies.</li><li>Deploy handlines with a combined flow rate of 500 GPM.</li><li>Assemble search and rescue teams.</li><li>Establish ventilation and rapid intervention teams.</li><li>Conduct decontamination and demobilization.</li><li><strong>Fire Investigation:</strong> Identify origin and cause; report injuries or fatalities to the Oklahoma State Fire Marshal’s Office.</li></ul><h4><strong>Apparatus Assignments:</strong></h4><ul><li><strong>First Engine:</strong> Establish primary fire attack and primary search. Secure a water supply from the closest available hydrant or static source. Deploy the initial attack handline for interior or transitional attack. Ensure the apparatus is positioned to allow adequate access for aerial apparatus.</li><li><strong>Second Engine:</strong> Establish a secondary water supply, if required. Assist with initial fire attack by deploying backup or secondary handlines. Assume search and rescue responsibilities.</li><li><strong>Aerial Apparatus:</strong> Position for vertical ventilation, roof access, or elevated master stream operations. Coordinate with the incident commander to prioritize aerial operations.</li><li><strong>Additional Units:</strong> Report to the staging area and await assignment. Support water supply, overhaul, and decontamination efforts.</li></ul><h4><strong>Fire Control & Extinguishment: Enhanced Tactics for Large Structures:</strong></h4><ul><li><strong>Exterior Control (Transitional Attack):</strong> Use solid or straight streams to cool the thermal layer and improve interior conditions. Coordinate with interior crews to prevent conflicting operations.</li><li><strong>Interior Advancement:</strong> Use straight or smooth-bore nozzles to cool the overhead gases as the crew advances. Leverage TICs to monitor conditions and locate fire spread. Maintain flow path control with coordinated ventilation efforts.</li><li><strong>Direct Fire Control:</strong> Apply water directly to burning material to suppress the fire at its seat. Ensure the flow rate matches fire intensity and avoids structural damage from excess water weight.</li><li><strong>Compartment Isolation:</strong> Close doors or other openings to confine the fire to its current location and reduce oxygen availability.</li><li><strong>Special Considerations for Large Structures:</strong> Utilize larger handlines (2 1/2\") for extended reach and higher flow rates. Pre-assign teams for specific tasks such as roof operations, stairwell management, and egress control. Continuously assess structural integrity with special attention to trusses and load-bearing walls.</li></ul><h4><strong>Search Operations for Large Structures:</strong></h4><ul><li><strong>Thermal Imaging Cameras (TICs):</strong> Deploy TICs to quickly locate heat signatures and identify occupants or hidden fire areas. Use TICs to guide crews through smoke-filled environments and large open spaces.</li><li><strong>Large Area Search Procedures:</strong> Assign search teams with TICs for accountability. Divide the structure into manageable sectors or zones to ensure complete coverage. Use systematic marking systems to identify searched areas.</li><li><strong>Stairwell and Egress Focus:</strong> Prioritize searches in stairwells and near exits where occupants are likely to congregate. Assign teams to monitor fire spread and potential smoke migration into egress routes.</li><li><strong>Vertical Searches:</strong> Assign teams to specific floors to reduce redundancy and ensure full coverage. Evaluate roof access and areas above fire zones for potential victims.</li></ul>",
"2.4":"<h2>Row Building Structure Fire</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish guidelines for the placement and use of apparatus, equipment, and personnel at mixed-use row building fires. Row buildings are defined as structures—commercial or residential—that share common walls.</p><h3><strong>II. DISCUSSION</strong></h3><p>Row structures, whether commercial or residential, present unique challenges, such as entrapped occupants, difficult access and egress, heavy fuel loads, hazardous materials, connected exposures, and non-compliant structural and mechanical hazards. Examples include 248 – 256 Edmond Road NE, where shared walls may facilitate rapid fire spread.</p><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Operational Priorities:</strong></h4><ul><li>Establish incident command.</li><li>Secure two adequate water supplies.</li><li>Deploy handlines with a combined flow rate of 500 GPM.</li><li>Assemble search and rescue teams.</li><li>Establish ventilation and rapid intervention teams.</li></ul><h4><strong>Apparatus Assignments:</strong></h4><ul><li><strong>First Engine:</strong> Establish primary fire attack and primary search. Secure a water supply from the closest available hydrant or static source. Deploy the initial attack handline. Ensure the apparatus is positioned to allow adequate access for aerial apparatus.</li><li><strong>Second Engine:</strong> Establish a secondary water supply to rear or structure or FDC. Assist with initial fire attack by deploying backup or secondary handlines. Assume search and rescue responsibilities.</li><li><strong>Aerial Apparatus:</strong> Position for vertical ventilation, roof access, or elevated master stream operations.</li></ul><h4><strong>Fire Control & Extinguishment - Enhanced Tactics for Row Buildings:</strong></h4><ul><li><strong>Exposure Protection:</strong> Assign crews to monitor adjoining exposures on sides B and D. Deploy hoselines to prevent fire spread through common walls and attics. Utilize thermal imaging cameras (TICs) to identify hidden fire spread.</li><li><strong>Interior Advancement:</strong> Use straight or smooth-bore nozzles to cool overhead gases as the crew advances. Monitor structural integrity of shared walls and floors continuously.</li><li><strong>Compartment Isolation:</strong> Close doors or other openings to confine the fire to its current location and reduce oxygen availability. Coordinate with ventilation efforts to maintain safety and visibility for attack crews.</li><li><strong>Roof Operations:</strong> Position ground ladders for roof access and secondary egress. Monitor roof conditions continuously for potential collapse. Ventilate strategically to release heat and smoke.</li></ul><h4><strong>Search Operations for Row Buildings:</strong></h4><ul><li><strong>Thermal Imaging Cameras (TICs):</strong> Deploy TICs to locate heat signatures and identify occupants or hidden fire areas. Use TICs to guide crews through smoke-filled environments and connected exposures.</li><li><strong>Exposure Searches:</strong> Assign teams to adjoining units to monitor for fire spread. Systematically search for occupants and potential fire extension.</li><li><strong>Large Area Search Procedures:</strong> Assign search teams with search ropes and TICs for accountability. Divide the structure into manageable sectors or zones to ensure complete coverage. Use systematic marking systems to identify searched areas.</li></ul>",
"2.5":"<h2>Sprinkler and Standpipe Operations</h2><h3><strong>I. PURPOSE</strong></h3><p>To establish a guideline for the use of fire department connections (FDC) to provide rapid, uninterrupted water supply to support building fire protection systems.</p><h3><strong>II. DISCUSSION</strong></h3><p>There are several buildings in the City of Piedmont equipped with fire sprinkler systems or standpipe systems. While department preplan maps aim to identify FDC locations, engine operators must familiarize themselves with the types and locations of these systems.</p><h4><strong>NFPA 14 Requirements:</strong></h4><ul><li><strong>Flow Requirements:</strong> Class I & III standpipe systems must flow a minimum of 500 GPM through the two most remote 2.5” hose connections.</li><li><strong>Residual Pressure:</strong> A minimum residual design pressure of 100 PSI is required at the most remote hose connection.</li><li><strong>Pressure Regulation:</strong> Systems exceeding 175 PSI require listed pressure-regulating devices to limit both static and residual pressures.</li></ul><h3><strong>III. GUIDELINE</strong></h3><h4><strong>Standpipe and Sprinkler Engine Operations</strong></h4><ol><li>The assigned engine will identify a water supply and support building systems as soon as possible upon arrival.</li><li>Positioning options for FDC supply include:<ul><li><strong>Forward Lay:</strong> From the hydrant to a position close to the FDC.</li><li><strong>Reverse Lay:</strong> From the FDC to the hydrant.</li><li><strong>Hydrant Positioning:</strong> Take a position at the hydrant and hand stretch supply hose to the FDC.</li></ul></li><li>After establishing a water supply, stretch lines to the FDC:<ul><li>Older systems typically use <strong>2.5” wye-type connections</strong>.</li><li>Newer systems require a <strong>single 4” connection</strong>.</li></ul></li><li>Inspect FDC connections for damage, swivels, and debris before connecting.</li><li>Connect lines:<ul><li>Use <strong>both 2.5” connections</strong> if applicable or the <strong>single 4” connection</strong>.</li><li>Charge wye connections <strong>one line at a time</strong> to avoid backflow.</li></ul></li><li>Pump systems at the following pressures:<ul><li><strong>Sprinkler Systems:</strong> 150 PSI at the FDC.</li><li><strong>Standpipe Systems:</strong> 150 PSI then adjust to pressure from interior team max of 175 PSI.</li><li><strong>Flow Rate:</strong> Maintain a minimum of 500 GPM.</li></ul></li><li>Monitor pump panel gauges and radio traffic for adjustments to pump pressures.</li><li><strong>Sprinkler Shutoff:</strong> Automatic sprinklers shall remain active until fire extinguishment is confirmed.</li></ol><h4><strong>Strategic Considerations</strong></h4><ul><li><strong>Supply Line Limitations:</strong><ul><li>A single 3” supply line supports <strong>500 GPM</strong> up to 600’.</li><li>A single 4” supply line supports <strong>800 GPM</strong> up to 1,000’.</li></ul></li><li><strong>Buildings with Fire Pumps:</strong> Remain vigilant for pump overheating if minimal water is needed.</li><li><strong>Prioritization:</strong> Supply the <strong>standpipe system first</strong> if separate FDCs exist.</li><li><strong>FDC Swivel Failures:</strong> Use a <strong>double male adapter</strong> followed by a <strong>double female adapter</strong> to complete the connection.</li><li><strong>Damaged FDC:</strong> Connect to the riser outlet on the ground floor with a <strong>2.5” double female adapter</strong>.</li><li><strong>Avoid Pump Test Connections:</strong> Test connections have <strong>male threads</strong> and external valves. These are <strong>not for fire department use</strong>.</li></ul><h4><strong>Standpipe Kit / High-Rise Packs</strong></h4><p>The standpipe kit/high-rise pack contents include: 3 (50’) sections of 1.5” green hose folded in high-rise bundle style.</p><h4><strong>Standpipe Interior Operations</strong></h4><p>Standpipe operations are <strong>low frequency/high-risk</strong> events requiring crew proficiency and equipment familiarity.</p><ul><li>Conduct a <strong>360° size-up</strong>, including alarm annunciator panels, building management and bystanders.</li><li>Inspect standpipe connections for open valves and check each floor for smoke. Be aware of smoke traveling up pipe chases.</li><li>Determine the stretch type:<ul><li><strong>Dry Stretch:</strong> No immediate smoke or fire.</li><li><strong>Wet Stretch:</strong> Charge lines when heavy smoke is encountered in stairwells.</li></ul></li><li>Operate lines from standpipe valves:<ul><li>Use intermediate stair landings or floors below the fire.</li><li>Avoid connecting within IDLH environments.</li></ul></li><li>Flush the standpipe system before connecting lines.</li></ul><h4><strong>Common Standpipe Complications</strong></h4><ul><li><strong>Standpipe Valves Won’t Open:</strong> Use a gate valve and pipe wrench. Adjust the packing nut and attempt to open. If unsuccessful, connect on the floor below.</li><li><strong>Pressure Regulating Devices (PRVs):</strong> Bypass by removing stopper pins (not present in PFD area).</li><li><strong>Total System Failure:</strong> Deploy hoses vertically through stairwells or exterior windows. Support vertical couplings with webbing. Avoid obstructing stairwell access with hoses.</li></ul>",
"2.6":"<h2>Vehicle Fire</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly control vehicle fires, minimizing life and property damage.</p><h3><strong>II. DISCUSSION</strong></h3><p>Vehicle fires may appear as small, simple, and isolated incidents. Typically occurring in open areas, they produce large amounts of heat and smoke that can quickly spread to nearby exposures. Vehicle fires present unique hazards that must be addressed with safe practices and tactical approaches to prevent injuries and property loss.</p><h3><strong>III. GUIDELINE</strong></h3><ol><li>The appropriate apparatus shall respond to the location quickly with due regard for the safety of others (SOP 1.4).</li><li>Implement <strong>Incident Command</strong>.</li><li>All personnel must don proper <strong>Personal Protective Equipment (PPE)</strong>, including full turnout gear and SCBA when operating near fire or smoke.</li><li><strong>Apparatus Positioning:</strong> Position apparatus for maximum firefighter safety:<ul><li>Block at least one lane to ensure a safety zone.</li><li>Position the engine so the pump operator has a clear view of the fire from the pump panel.</li></ul></li><li>A <strong>1-1/2” handline</strong> shall be used for heavy fire involvement. Booster lines may be used for smaller fires if conditions allow.</li><li><strong>Traffic Control:</strong> Address the need for traffic control during suppression operations. Responder safety takes precedence over traffic flow.</li><li>When the fire is extinguished and no additional hazards exist, reposition apparatus to improve traffic flow if necessary. Firefighter safety remains the top priority.</li></ol><h3><strong>IV. STRATEGIC CONSIDERATIONS</strong></h3><ol><li>Ensure there are no victims threatened by the fire.</li><li>Stabilize the vehicle to prevent movement.</li><li>Confine the fire to the vehicle and protect nearby exposures.</li><li>Gain access to areas of hidden or concealed fire.</li><li>Locate the battery and secure the vehicle’s power.</li></ol><h3><strong>V. TACTICAL CONSIDERATIONS</strong></h3><ol><li><strong>Small Fires:</strong> Small fires may be extinguished with a pressurized extinguisher.</li><li>The <strong>pump operator</strong> should pump attack lines according to the apparatus pump chart.</li><li><strong>Hazards of Well-Involved Vehicle Fires:</strong><ul><li><strong>Popping Tires:</strong> Explosions may occur from tire pressure failure.</li><li><strong>Airbag Deployment:</strong> Airbags may deploy unpredictably.</li><li><strong>Gas Struts in Bumpers:</strong> These can forcibly explode, sending shrapnel or bumpers flying.</li><li><strong>Gas Struts for Hatches/Hoods:</strong> Similar explosions may occur with these struts.</li><li><strong>Fuel Tank Failure:</strong> May result in flammable liquid fires and moving hazards.</li></ul></li><li><strong>Flammable Liquid Fires:</strong> Require Class B foam or dry powder extinguishers. Foam can be applied by using an <strong>inline foam eductor</strong> or onboard foam tanks for larger fires.</li><li>Approach the vehicle from the <strong>sides or corners</strong> to reduce risks associated with bumper gas strut failures.</li><li>Work from the <strong>upwind and uphill</strong> side whenever possible.</li><li><strong>Overhaul and Salvage:</strong> Once the main fire is controlled:<ul><li>Open the vehicle to expose hidden fire areas: hood, doors, trunk, and glass.</li><li>Perform complete extinguishment and check for rekindle.</li></ul></li><li>Remove loose debris from the roadway using hose streams or brooms to restore safety.</li></ol>",
"2.7":"<h2>Electric Vehicle Fires</h2><h3><strong>I. PURPOSE</strong></h3><p>To define consistent guidelines and responsibilities for firefighters to safely, efficiently, and quickly control fires involving electric vehicles (EVs) powered by lithium-ion battery packs, minimizing life and property damage.</p><h3><strong>II. DISCUSSION</strong></h3><p>Electric vehicle fires may initially appear similar to standard vehicle fires but present unique challenges due to lithium-ion battery involvement. EV fires can generate extreme heat, toxic gases, and pose risks of reignition, requiring excessive amounts of water (&gt;20,000 gallons in some reported cases). If the fire does not involve the battery, operations should follow <strong>SOG 2.6</strong> for standard vehicle fires. If the battery is involved or off-gassing, this guideline shall be followed.</p><h3><strong>III. GUIDELINE</strong></h3><ol><li>The appropriate apparatus shall respond quickly with due regard for safety (SOP 1.4).</li><li>Implement <strong>Incident Command</strong>.</li><li>All personnel must don proper <strong>Personal Protective Equipment (PPE):</strong><ul><li>Full turnout gear and SCBA when operating near fire or smoke.</li><li>The Incident Commander shall wear appropriate bunker gear or helmet and duty uniform based on the situation.</li></ul></li><li><strong>Apparatus Positioning:</strong> Position apparatus to ensure maximum firefighter safety:<ul><li>Block a minimum of one traffic lane to create a safety zone.</li><li>Position the engine so the pump operator has a clear view of the fire.</li></ul></li><li>For heavy fire involvement, deploy a <strong>minimum 1-1/2” handline</strong>. Booster lines may be used for smaller fires.</li><li>Address traffic control needs. Responder safety takes precedence over maintaining traffic flow.</li><li><strong>Call for a fire investigator</strong> if the fire cause appears suspicious.</li><li>Verify completion of all applicable sections of the incident report before clearing the scene.</li></ol><h3><strong>IV. STRATEGIC CONSIDERATIONS</strong></h3><ol><li>Ensure there are no victims threatened by the fire.</li><li>If fire does <strong>not</strong> involve the battery, follow <strong>SOP 2.6</strong>.</li><li>Establish sustained water flow operations capable of at least <strong>600 GPM</strong>.</li><li>Use <strong>large volumes of water</strong> to cool and extinguish the battery fire. Foam is not recommended.</li><li>Confine the fire to the vehicle and protect nearby exposures:<ul><li>Relocate the vehicle (if feasible) away from buildings, garages, or exposures.</li></ul></li><li>Avoid attempting to open the battery compartment.</li><li>After flames are extinguished, monitor the battery temperature using a <strong>Thermal Imaging Camera (TIC)</strong>:<ul><li>Observe the battery for at least <strong>45 minutes</strong> without signs of smoke, sparks, or heating before releasing the vehicle.</li></ul></li><li>Inform second responders (tow companies, storage facilities) about battery reignition risks:<ul><li>Advise storage in open areas at least <strong>50 feet from any exposures</strong>.</li></ul></li></ol><h3><strong>V. TACTICAL CONSIDERATIONS</strong></h3><ol><li>The <strong>pump operator</strong> shall pump attack lines according to the apparatus pump chart.</li><li>Be aware of additional hazards from well-involved EV fires:<ul><li><strong>Popping Tires:</strong> Tire pressure failure may cause explosive sounds.</li><li><strong>Airbag Deployment:</strong> Airbags may deploy unpredictably.</li><li><strong>Gas Struts:</strong> Found in bumpers, hatches, and hoods; they may explode and send shrapnel flying.</li><li><strong>Hybrid Fuel Tanks:</strong> Hybrid vehicles may still have flammable liquid fire risks.</li></ul></li><li>For direct cooling of the battery:<ul><li>Lift or tilt the vehicle for access <strong>only if safe</strong>.</li><li>Apply water <strong>only</strong> through natural openings (vents or collision damage).</li></ul></li><li>Approach the vehicle from the <strong>sides or corners</strong> to reduce exposure to gas strut failures.</li><li>Work from the <strong>upwind and uphill</strong> side whenever possible.</li><li><strong>Overhaul and Salvage:</strong> Once exposed fire is controlled:<ul><li>Open hood, doors, and trunk for complete extinguishment.</li><li>Remove glass if necessary.</li></ul></li><li>Position the vehicle to allow <strong>drainage of excess water</strong>, helping reduce reignition risks.</li><li>Remove any loose debris from the roadway using hose streams or brooms.</li></ol>",
